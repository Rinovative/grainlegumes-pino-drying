[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grainlegumes-pino-drying"
version = "0.1.0"
description = "Physics-informed neural-operator pipeline for steady 2D airflow through heterogeneous porous media, motivated by grain-legume drying applications."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rino M. Albertin" }]

[project.optional-dependencies]
generation-cpu = [
  "h5py",
  "numpy",
  "PyYAML",
  "scipy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.pytest.ini_options]
markers = [
  "real_data: strict opt-in acceptance requiring RUN_REAL_DATA_TESTS=1 and an explicit STORAGE_ROOT",
  "integration: End-to-end lifecycle, subprocess, shell-wrapper, package-publication, worker, or training/artifact workflow tests.",
]

# ============================================================
# 🧹 Ruff Configuration
# ============================================================

[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = [
  "venv",
  ".venv",
  ".mypy_cache",
  ".ruff_cache",
  "logs",
  "data",
  "outputs",
  "results",
  "build",
  "dist"
]

# ------------------------------------------------------------
# ✨ Ruff Formatter
# ------------------------------------------------------------
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ------------------------------------------------------------
# 🧹 Ruff Linter
# ------------------------------------------------------------
[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # 🔧 Formatting conflicts
  "COM812",  # Trailing comma handled by formatter

  # 🧾 Docstring style conflicts
  "D203",  # Conflicts with D211
  "D212",  # Conflicts with D213

  # 📦 Current package structure
  "INP001",  # Allow implicit namespace-style layout in current src setup

  # 🔬 Scientific / research code conventions
  "ANN401",  # Allow Any
  "FBT001", "FBT002", "FBT003",  # Allow boolean arguments
  "PLR0913", "PLR0917",  # Allow many function arguments, including positional scientific APIs
  "N806", "N803",  # Allow scientific variable names
  "CPY001",  # Keep the Apache copyright notice at repository level
  "EXE002",  # Ignore executable-bit mismatch
  "T201",  # Allow print statements
  "D205", # Allow multi-line docstring summary to be on a separate line
  "D400", # Allow the first line to not end with a period
  "D415" # Allow the first line to not end with a period, question mark, or exclamation point
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = [
  "ANN",  # Interactive notebook helpers do not require a fully typed API surface
  "EM102",  # Direct contextual exception messages are clearer in notebook cells
  "TRY003",  # Notebook validation errors are local, not reusable exception APIs
]

# ------------------------------------------------------------
# 🧠 Code complexity
# ------------------------------------------------------------
[tool.ruff.lint.mccabe]
max-complexity = 20

# ------------------------------------------------------------
# 🧱 Structural limits
# ------------------------------------------------------------
[tool.ruff.lint.pylint]
max-branches = 20
max-statements = 100
max-returns = 10

# ============================================================
# 🧮 Type Checking
# ============================================================

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = [".", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
strict_optional = true

exclude = [
  "logs/",
  "data/",
]

[[tool.mypy.overrides]]
module = [
  "h5py",
  "ipywidgets",
  "neuralop",
  "neuralop.*",
  "pandas",
  "pandas.*",
  "scipy",
  "scipy.*",
  "tqdm",
  "tqdm.auto",
]
ignore_missing_imports = true
