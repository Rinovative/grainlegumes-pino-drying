[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grainlegumes-pino-drying"
version = "0.1.0"
description = "Physics-informed neural-operator pipeline for steady airflow and transient grain-legume drying in heterogeneous porous media."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Rino M. Albertin" }]
license = "Apache-2.0"
license-files = ["LICENSE.md"]
dependencies = [
  "h5py",
  "ipykernel",
  "ipython",
  "ipywidgets",
  "matplotlib",
  "nbconvert",
  "neuraloperator @ git+https://github.com/neuraloperator/neuraloperator.git@86a8bc7812a31b42c4f7895693cf4ac11521c066",
  "numpy",
  "optuna",
  "pandas",
  "pyarrow",
  "PyYAML",
  "scipy",
  "seaborn",
  "torch>=2.4,<2.5",
  "tqdm",
  "wandb==0.28.1",
]

[dependency-groups]
dev = [
  "basedpyright",
  "mypy",
  "pandas-stubs",
  "pip",
  "pytest",
  "radon",
  "ruff==0.15.11",
  "setuptools",
  "types-PyYAML",
  "typing-extensions",
  "wheel",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.pytest.ini_options]
markers = [
  "real_data: strict opt-in acceptance requiring RUN_REAL_DATA_TESTS=1 and an explicit STORAGE_ROOT",
  "integration: End-to-end lifecycle, subprocess, shell-wrapper, package-publication, worker, or training/artifact workflow tests.",
]

# One project-wide lint policy; the formatter owns whitespace and trailing commas.
[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # Trailing commas are owned by Ruff's formatter.
  "D203",  # Use D211 for consistent class docstring spacing.
  "D212", "D213",  # Module summaries start on the opening line; NumPy API docstrings may start below it. The module-header validator owns module structure.
  "ANN401",  # Validated scientific/configuration payloads have dynamic values.
  "FBT001", "FBT002", "FBT003",  # Explicit scientific and lifecycle boolean controls.
  "PLR0913", "PLR0917",  # Scientific APIs expose independently named physical inputs.
  "N806", "N803",  # Mathematical identifiers follow the governing equations.
  "CPY001",  # The repository-level Apache license owns the copyright notice.
  "T201",  # CLIs and interactive scientific workflows intentionally report to stdout.
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Test assertions and descriptive test names are the pytest interface. Test-owned
# numeric expectations express the behavior under test, rather than production defaults.
# Private access deliberately exercises focused numerical and injected-failure boundaries.
"tests/**/*.py" = ["S101", "D103", "PLR2004", "INP001", "SLF001"]
# Executable helpers are scripts, not importable namespace packages.
"scripts/*.py" = ["INP001"]
# Notebook cells are an interactive category, not a reusable typed Python API.
"notebooks/*.ipynb" = ["ANN", "EM102", "TRY003", "INP001"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-branches = 20
max-statements = 100
max-returns = 10

# ============================================================
# 🧮 Type Checking
# ============================================================

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = [".", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
strict_optional = true

exclude = [
  "logs/",
  "data/",
]

[[tool.mypy.overrides]]
module = [
  "h5py",
  "ipywidgets",
  "neuralop",
  "neuralop.*",
  "pandas",
  "pandas.*",
  "scipy",
  "scipy.*",
  "tqdm",
]
ignore_missing_imports = true
