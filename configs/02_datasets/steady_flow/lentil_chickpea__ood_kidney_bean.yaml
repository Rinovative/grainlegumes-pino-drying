# Role: Dataset plan of the reduced steady set (demo size): lentil and chickpea in distribution, kidney_bean as material OOD. Edit: only to change the demo set.
schema_kind: dataset_plan
task: steady_flow
materials:  # Plan order = name order. Counts per design kind, each a power of two; an OOD material draws from its own test design.
  lentil: {role: id, train: 512, validation: 64, test: 128}
  chickpea: {role: id, train: 512, validation: 64, test: 128}
  kidney_bean: {role: ood, test: 128}
generation:
  seed_base: 9300  # Generation root of the steady task; every design seed derives from it, the material and the design kind.
  minimum_success_rate: 0.9  # Per material: stop replacing once the one-sided 95 % upper bound of the success rate falls below this value.
  sources_config: configs/01_generation/physical_model/sources.yaml
  registry_config: configs/01_generation/physical_model/registry.yaml
  common_config: configs/01_generation/physical_model/common.yaml
  operations_config: configs/01_generation/physical_model/fixed_bed.yaml
  bed_fields_config: configs/01_generation/physical_model/bed_fields.yaml
  profile_config: configs/01_generation/physical_model/profiles/steady_flow.yaml
  execution_config: configs/01_generation/execution.yaml
