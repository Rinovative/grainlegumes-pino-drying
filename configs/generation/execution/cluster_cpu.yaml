schema_kind: generation_execution
schema_version: 1
runtime:
  executable: comsol
  module_initialization:
  - module load Python/3.10
  - module load Comsol/v6.4
  timeout_seconds: 3600
  maximum_failures: 1
  extra_arguments: []
retention:
  retain_raw_csv: false
  retain_solved_model: false
cluster:
  max_nodes: 1
  cases_per_node: 2
  cores_per_case: 16
  max_parallel_cases: 2
  cores_per_node: 32
  scheduler_kind: slurm
  partition: standard
  wall_time: null
  scheduler_options: []
site:
  cpu_host: sricehpc01
  scheduler: slurm
  partition: standard
  cores_per_node: 32
  python_module: Python/3.10
  comsol_module: Comsol/v6.4
  python_executable: python3
  comsol_executable: comsol
