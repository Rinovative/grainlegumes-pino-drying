schema_kind: generation_execution
schema_version: 1
runtime:
  timeout_seconds: 2400
  graceful_stop_reserve_seconds: 300
  maximum_failed_cases: 10
  extra_arguments: []
  temporary_license_retry:
    enabled: true
    initial_delay_seconds: 15
    maximum_delay_seconds: 30
    maximum_wait_seconds: null
    in_allocation_retry:
      enabled: true
      maximum_window_seconds: 300
      pause_after_capacity_failure_seconds: 5
retention:
  family_generalization: compact
  steady_flow_id_dataset: compact
  technical_runtime_smoke: full
  pilot_check: full
submission:
  max_admission_cases: 4
  poll_interval_seconds: 15
  max_running_cases: null
cluster:
  cores_per_case: 8
  wall_time: "01:05:00"
  scheduler_options: []
site:
  cpu_host: sricehpc01
  scheduler: slurm
  partition: standard
  cores_per_node: 32
  python_module: Python/3.10
  comsol_module: Comsol/v6.4
  python_executable: python3
  comsol_executable: comsol
