schema_kind: generation_profile
schema_version: 2
simulation_profile: steady_flow
steady_flow_conditioning:
  schema_kind: steady_flow_conditioning
  schema_version: 1
  exhaustive: true
  stationary_solution_contract_id: vp2_stationary_airflow_v1
  dependencies:
  - name: Kxx
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: Kxy
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: Kyy
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: eps_bed
    affects_stationary_solution: true
    owner: model_input
    unit: '1'
  - name: p_in_bc
    affects_stationary_solution: true
    owner: model_input
    unit: Pa
  - name: T_flow_ref
    affects_stationary_solution: true
    owner: package_fixed
    unit: K
  - name: p_ref
    affects_stationary_solution: true
    owner: package_fixed
    unit: Pa
  - name: p_out
    affects_stationary_solution: true
    owner: package_fixed
    unit: Pa
  additional_case_varying_solver_scalars: []
exports:
- role: steady_flow_fields
  temporal_kind: stationary
  source: stationary_fields.csv
  delimiter: ','
  columns:
    x: x
    y: y
    Kxx: Kxx
    Kxy: Kxy
    Kyy: Kyy
    eps_bed: eps_bed
    p_in_bc: p_in_bc
    u: u
    v: v
    p: p
