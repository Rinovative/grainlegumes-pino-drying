schema_kind: generation_profile
schema_version: 1
simulation_profile: transient_drying
steady_flow_conditioning:
  schema_kind: steady_flow_conditioning
  schema_version: 1
  exhaustive: true
  stationary_solution_contract_id: vp2_stationary_airflow_v1
  dependencies:
  - name: Kxx
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: Kxy
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: Kyy
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: eps_bed
    affects_stationary_solution: true
    owner: model_input
    unit: '1'
  - name: p_in_bc
    affects_stationary_solution: true
    owner: model_input
    unit: Pa
  - name: T_flow_ref
    affects_stationary_solution: true
    owner: package_fixed
    unit: K
  - name: p_ref
    affects_stationary_solution: true
    owner: package_fixed
    unit: Pa
  - name: p_out
    affects_stationary_solution: true
    owner: package_fixed
    unit: Pa
  additional_case_varying_solver_scalars: []
exports:
- role: steady_flow_fields
  temporal_kind: stationary
  source:
    state: runtime_confirmed
    pattern: stationary_fields.csv
  delimiter: ','
  columns:
    x:
      state: runtime_confirmed
      source_header: x
    y:
      state: runtime_confirmed
      source_header: y
    Kxx:
      state: runtime_confirmed
      source_header: Kxx
    Kxy:
      state: runtime_confirmed
      source_header: Kxy
    Kyy:
      state: runtime_confirmed
      source_header: Kyy
    eps_bed:
      state: runtime_confirmed
      source_header: eps_bed
    p_in_bc:
      state: runtime_confirmed
      source_header: p_in_bc
    X_0_db_field:
      state: runtime_confirmed
      source_header: X_0_db_field
    u:
      state: runtime_confirmed
      source_header: u
    v:
      state: runtime_confirmed
      source_header: v
    p:
      state: runtime_confirmed
      source_header: p
    rho_bu_dry:
      state: runtime_confirmed
      source_header: rho_bu_dry
- role: transient_fields
  temporal_kind: regular_time_series
  source:
    state: runtime_confirmed
    pattern: transient_states.csv
  delimiter: ','
  columns:
    t:
      state: runtime_confirmed
      source_header: t
    x:
      state: runtime_confirmed
      source_header: x
    y:
      state: runtime_confirmed
