schema_kind: generation_profile
schema_version: 1
simulation_profile: transient_drying
steady_flow_conditioning:
  schema_kind: steady_flow_conditioning
  schema_version: 1
  exhaustive: true
  stationary_solution_contract_id: vp2_stationary_airflow_v1
  dependencies:
  - name: Kxx
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: Kxy
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: Kyy
    affects_stationary_solution: true
    owner: model_input
    unit: m^2
  - name: eps_bed
    affects_stationary_solution: true
    owner: model_input
    unit: '1'
  - name: p_in_bc
    affects_stationary_solution: true
    owner: model_input
    unit: Pa
  - name: T_flow_ref
    affects_stationary_solution: true
    owner: package_fixed
    unit: K
  - name: p_ref
    affects_stationary_solution: true
    owner: package_fixed
    unit: Pa
  - name: p_out
    affects_stationary_solution: true
    owner: package_fixed
    unit: Pa
  additional_case_varying_solver_scalars: []
exports:
- role: steady_flow_fields
  temporal_kind: stationary
  source: stationary_fields.csv
  delimiter: ','
  columns:
    x: x
    y: y
    Kxx: Kxx
    Kxy: Kxy
    Kyy: Kyy
    eps_bed: eps_bed
    p_in_bc: p_in_bc
    X_0_db_field: X_0_db_field
    u: u
    v: v
    p: p
    rho_bu_dry: rho_bu_dry
- role: transient_fields
  temporal_kind: regular_time_series
  source: transient_states.csv
  delimiter: ','
  columns:
    t: t
    x: x
    y: y
    T: T
    phi: mt.phi
    w_surf: w_surf
    w_int: w_int
- role: global_time_series
  temporal_kind: regular_time_series
  source: global_timeseries.csv
  delimiter: ','
  columns:
    t: t
    X_wb_bulk: X_wb_bulk
    f_wet_dm: f_wet_dm
    m_w_gr: m_w_gr
    m_v_gas: m_v_gas
    m_dot_evap: m_dot_evap
    m_dot_v_in: m_dot_v_in
    m_dot_v_out: m_dot_v_out
    mt_mass_balance: mt_mass_balance
    T_out_mean: T_out_mean
    phi_out_mean: phi_out_mean
- role: final_status
  temporal_kind: final_status
  source: final_status.csv
  delimiter: ','
  columns:
    t_final: t_final
    f_wet_dm_final: f_wet_dm_final
    X_wb_bulk_final: X_wb_bulk_final
    X_wb_max_final: X_wb_max_final
    T_min_final: T_min_final
    T_max_final: T_max_final
    phi_min_final: phi_min_final
    phi_max_final: phi_max_final
