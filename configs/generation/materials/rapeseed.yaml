schema_kind: generation_material
schema_version: 1
material_family: rapeseed
material_scope:
  common_name: Rapeseed / canola
  species: Brassica napus L.
  market_class: canola_quality_rapeseed
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature uncrushed rapeseed or canola seed
permeability:
  nominal: 4.0e-09
  support:
    lower: 2.0e-09
    upper: 9.0e-09
  transform: log
  distribution: uniform_in_log_space
  provenance:
    evidence: engineering_estimate
    source_refs:
    - canola_airflow
    applicability:
      packing: Only for packing bands in each complete density record; generated mean
        eps must pass the material band.
  ood_supports:
  - lower: 6.0e-10
    upper: 1.3e-09
  - lower: 1.44e-08
    upper: 2.475e-08
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Explicit synthetic stress intervals admitted by the registry-wide transformed
      gap and width policy; permeability tails also satisfy fixed Kozeny-Carman guards.
    verification: mathematically_reproduced
packing_porosity_mean_support:
  lower: 0.365
  upper: 0.422
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - canola_thermal
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole-seed bulk and particle density ranges from one compatible study;
        reference pair selected near 6-11% wb.
density_calibration:
  record_id: rapeseed_density_calibration_v1
  reference:
    rho_bu_dry_ref: 620.0
    eps_bed_cal_ref: 0.4
  rho_bu_dry_ref_support:
    lower: 590.0
    upper: 640.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 500
    eps_bed_cal_ref: 0.51612903
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  - record_id: dense_high_density
    rho_bu_dry_ref: 800
    eps_bed_cal_ref: 0.22580645
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - canola_thermal
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole-seed bulk and particle density ranges from one compatible study;
        reference pair selected near 6-11% wb.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete loose and dense packing records derived at the fixed reference
      inferred dry particle density.
    verification: mathematically_reproduced
