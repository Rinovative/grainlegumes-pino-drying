  market_acceptance_moisture_wb: 0.06
  safe_storage_moisture_wb: 0.06542056074766356
  provenance:
    evidence: official_industry_target
    source_refs:
    - swiss_oil
oswin:
  record_id: rapeseed_production_oswin_v1
  components:
    A_osw: 6.954722
    B_osw: -0.032779
    C_osw: 0.47020742
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or
    per degree Celsius increment
  provenance:
    evidence: literature_direct
    source_refs:
    - canola_oswin
    applicability:
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted
        by 0.01
      evidence_scope: Whole intact Option 500 canola, desorption, 30-60 degC, aw 0.11-0.81,
        % db
two_compartment_kinetics:
  record_id: rapeseed_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 2.0e-05
      support:
        lower: 1.1e-05
        upper: 3.3e-05
      transform: log
    r_int_surf:
      nominal: 0.22
      support:
        lower: 0.12
        upper: 0.4
      transform: log
    f_surf:
      nominal: 0.5
      support:
        lower: 0.3
        upper: 0.68
      transform: logit
  ood_records:
  - record_id: slow_internal_limited
    r_surf_0: 5.0e-06
    r_int_surf: 0.11
    f_surf: 0.35
  - record_id: fast_surface_exposed
    r_surf_0: 7.0e-05
    r_int_surf: 0.33
    f_surf: 0.65
  selection_rule: complete_record_atomic
  provenance:
    evidence: calibration_prior
    source_refs:
    - canola_drying
    applicability:
      evidence_scope: independent whole-particle X_db(t) or moisture-ratio curves
        at known T, RH/omega, airflow and product state; T(t) if available
      limitation: Kinetics were conservatively aligned using a limited numerical pilot
        to reduce seven-day right-censoring and produce informative neural-operator
        transients; they were not fitted to experiments or validated as real drying-time
        predictions.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete slow and fast records follow the common nominal-multiplier kinetics
      stress design equation.
    verification: mathematically_reproduced
