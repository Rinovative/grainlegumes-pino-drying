oswin:
  record_id: lentil_production_oswin_v1
  components:
    A_osw: 12.06202053
    B_osw: -0.0573838
    C_osw: 0.34338283
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or per degree Celsius increment
  provenance:
    source_refs:
    - lentil_oswin_source
    status: literature_fit
    derivation:
      kind: refitted_to_binding_convention
      origin: supplied_by_handoff
      verification: declared_only
      description: 'Re-fit of 4637 reconstructed source-surface points: RMSE 0.6542 percentage points db, MRE 3.867%, R2 0.96619.
        These statistics were calculated here, not reported by the source.'
    confidence: high
    validity:
      material_scope_ref: material_scope
      product_form: Whole mature dry red or brown lentil seed
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted by 0.01
      equation_or_method: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
      supplied_scope: 5-30 degC, RH 0.27-0.90, approximately 8-22% db; pooled equal-weight source-model surfaces of three
        whole red-lentil cultivars
