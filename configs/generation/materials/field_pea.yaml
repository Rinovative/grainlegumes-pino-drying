      - matouk_thermal
      status: literature_transfer
      derivation:
        kind: transferred_as_supplied
        origin: supplied_by_handoff
        verification: declared_only
        description: Dry granular-phase conductivity used inside the binding Maxwell-Eucken relation.
      confidence: medium_low
      validity:
        material_scope_ref: material_scope
        product_form: Whole mature dry field pea
        temperature: material-specific evidence; VP2 operation 25-40 degC
        humidity_or_aw: kinetics coupled to current Oswin equilibrium; otherwise not directly RH-dependent
        moisture_basis: rates act on volumetric water concentrations; cp_gr_dry is dry-solid basis
