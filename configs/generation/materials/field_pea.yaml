      product_form: Whole mature dry field pea
oswin:
  record_id: field_pea_production_oswin_v1
  components:
    A_osw: 12.06202053
    B_osw: -0.0573838
    C_osw: 0.34338283
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or per degree Celsius increment
  provenance:
    source_refs:
    - lentil_oswin_source
    status: literature_transfer
    derivation:
      kind: transferred_as_supplied
      origin: supplied_by_handoff
      verification: declared_only
      description: No pea-specific re-fit claimed. Validate against Garg and Chandra pea data before production.
    confidence: low_medium
    validity:
      material_scope_ref: material_scope
      product_form: Whole mature dry field pea
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted by 0.01
      equation_or_method: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
      supplied_scope: Transferred as the complete lentil tuple to whole field pea; direct pea literature supports modified
        Oswin but accessible full coefficients were unavailable.
