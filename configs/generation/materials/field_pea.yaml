    distribution: uniform
    provenance:
      source_refs:
      - pea_drying
      status: engineering_estimate
      derivation:
        kind: selected_engineering_estimate
        origin: supplied_by_handoff
        verification: declared_only
        description: Natural material-dependent starting moisture in dry basis; range is an explicit engineering envelope
