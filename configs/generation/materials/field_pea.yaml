  species: Pisum sativum L.
  market_class: yellow_or_green_field_pea
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature dry field pea
permeability:
  nominal: 1.65e-08
  support:
    lower: 8.0e-09
    upper: 4.0e-08
  transform: log
  distribution: uniform_in_log_space
  provenance:
    source_refs:
    - ba
    status: literature_transfer
    derivation:
      kind: transferred_as_supplied
      origin: supplied_by_handoff
      verification: declared_only
      description: Whole-particle packed-bed mean permeability; fill-method dependence included in range.
    confidence: medium
    validity:
      material_scope_ref: material_scope
      product_form: Whole mature dry field pea
      temperature: generator design; not a material property
      humidity_or_aw: generator design; not a material property
      packing_or_flow_regime: Only for packing bands in each complete density record; generated mean eps must pass the material
        band.
packing_porosity_mean_support:
  lower: 0.37
  upper: 0.43
  unit: '1'
  provenance:
    source_refs:
    - pea_physical
    status: coupled_record
    derivation:
      kind: complete_atomic_record
      origin: supplied_by_handoff
      verification: mathematically_reproduced
      description: Select a complete record atomically. Never combine rho from one source/record with eps from another.
    confidence: high
    validity:
      material_scope_ref: material_scope
      product_form: Whole mature dry field pea
      packing_or_flow_regime: Yalcin et al. wet bulk density and porosity regressions evaluated at 20% db; dry bulk density
        calculated as rho_wet/(1+Xdb).
