schema_kind: generation_material
schema_version: 1
material_family: field_pea
material_scope:
  common_name: Field pea
  species: Pisum sativum L.
  market_class: yellow_or_green_field_pea
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature dry field pea
permeability:
  nominal: 1.65e-08
  support:
    lower: 8.0e-09
    upper: 4.0e-08
  transform: log
  distribution: uniform_in_log_space
  provenance:
    evidence: literature_transfer
    source_refs:
    - ba
    applicability:
      packing: Only for packing bands in each complete density record; generated mean eps must pass the material band.
packing_porosity_mean_support:
  lower: 0.37
  upper: 0.43
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - pea_physical
    method: Select a complete record atomically. Never combine rho from one source/record with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Yalcin et al. wet bulk density and porosity regressions evaluated at 20% db; dry bulk density calculated as
        rho_wet/(1+Xdb).
density_calibration:
  record_id: field_pea_density_calibration_v1
  reference:
    rho_bu_dry_ref: 568.1
    eps_bed_cal_ref: 0.3938
  rho_bu_dry_ref_support:
    lower: 530.0
    upper: 620.0
    transform: log
  ood_records: []
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - pea_physical
    method: Select a complete record atomically. Never combine rho from one source/record with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Yalcin et al. wet bulk density and porosity regressions evaluated at 20% db; dry bulk density calculated as
        rho_wet/(1+Xdb).
thermal_properties:
  k_gr:
    nominal: 0.31
    support:
      lower: 0.25
      upper: 0.38
    transform: log
    distribution: uniform_in_log_space
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
  cp_gr_dry:
    nominal: 1950.0
    support:
      lower: 1650.0
      upper: 2250.0
    transform: log
    distribution: uniform_in_log_space
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
initial_moisture:
  mean_db:
    nominal: 0.25
    support:
      lower: 0.1904761904761905
      upper: 0.3157894736842105
    transform: linear
    distribution: uniform
    provenance:
      evidence: engineering_estimate
      source_refs:
      - pea_drying
      note: Natural material-dependent starting moisture in dry basis; range is an explicit engineering envelope around project
        or product-compatible drying evidence, not a market-target transfer.
  amplitude_db:
    nominal: 0.02
    support:
      lower: 0.005
      upper: 0.04
    transform: linear
    distribution: uniform
    provenance:
      evidence: synthetic_design
      source_refs:
      - pino_airflow_project
  field_support:
    lower: 0.1904761904761905
    upper: 0.3157894736842105
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - pea_drying
      method: X_db=X_wb/(1-X_wb)
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
target_moisture:
  selected_simulation_target_wb: 0.12
  market_acceptance_moisture_wb: 0.135
  safe_storage_moisture_wb: 0.11894
  provenance:
    evidence: derived
    source_refs:
    - swiss_crops
    note: Selected simulation stop target; market, safe-storage and selected values remain separate.
oswin:
  record_id: field_pea_production_oswin_v1
  components:
    A_osw: 12.06202053
    B_osw: -0.0573838
    C_osw: 0.34338283
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or per degree Celsius increment
  provenance:
    evidence: literature_transfer
    source_refs:
    - lentil_oswin_source
    applicability:
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted by 0.01
      evidence_scope: Transferred as the complete lentil tuple to whole field pea; direct pea literature supports modified
        Oswin but accessible full coefficients were unavailable.
    note: No pea-specific re-fit claimed. Validate against Garg and Chandra pea data before production.
two_compartment_kinetics:
  record_id: field_pea_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 8.0e-06
      support:
        lower: 3.5e-06
        upper: 1.6e-05
      transform: log
    r_int_surf:
      nominal: 0.16
      support:
        lower: 0.06
        upper: 0.3
      transform: log
    f_surf:
      nominal: 0.46
      support:
        lower: 0.28
        upper: 0.62
      transform: logit
  ood_records: []
  selection_rule: complete_record_atomic
  provenance:
    evidence: calibration_prior
    source_refs:
    - pea_drying
    applicability:
      evidence_scope: independent whole-particle X_db(t) or moisture-ratio curves at known T, RH/omega, airflow and product
        state; T(t) if available
      limitation: use pilot nominal, run only engineering preflight, treat as a calibration prior and do not claim experimental
        validation
