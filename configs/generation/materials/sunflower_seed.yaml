    support:
      lower: 0.0989010989010989
      upper: 0.2195121951219512
    transform: linear
    distribution: uniform
    provenance:
      evidence: engineering_estimate
      source_refs:
      - sunflower_sorption_drying_munder_2019
      note: Natural whole-seed starting-moisture envelope chosen inside the product-compatible
