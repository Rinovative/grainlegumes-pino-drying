schema_kind: generation_material
schema_version: 1
material_family: sunflower_seed
material_scope:
  common_name: Sunflower seed
  species: Helianthus annuus L.
  market_class: high_oleic_oil_type
  product_form: whole_achene
  coat_or_hull_state: hull_intact
  description: Cleaned whole mature high-oleic sunflower achene
permeability:
  nominal: 8.0e-08
  support:
    lower: 4.0e-08
    upper: 1.5e-07
  transform: log
  distribution: uniform_in_log_space
  provenance:
    evidence: engineering_estimate
    source_refs:
    - sunflower_airflow_canada_1990
    method: Kozeny-Carman-scale and airflow-envelope inversion for a loose bed of
      large elongated hull-intact achenes; exact fill pressure-drop data were not
      available.
    applicability:
      packing: Only for packing bands in each complete density record; generated mean
        eps must pass the material band.
  ood_supports:
  - lower: 1.2e-08
    upper: 2.6e-08
  - lower: 2.4e-07
    upper: 4.125e-07
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Explicit synthetic stress intervals admitted by the registry-wide transformed
      gap and width policy; permeability tails also satisfy fixed Kozeny-Carman guards.
    verification: mathematically_reproduced
packing_porosity_mean_support:
  lower: 0.5
  upper: 0.57
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - sunflower_density_isik_izli_2007
    method: Select the complete rho-eps pair atomically. Never combine density and
      porosity from different source states.
    verification: mathematically_reproduced
    applicability:
      packing: Isik and Izli whole-seed record at 10.06% db; measured bulk mass density
        divided by 1+X_db while porosity remains unchanged under the paired bulk/true-density
        conversion.
density_calibration:
  record_id: sunflower_seed_density_calibration_v1
  reference:
    rho_bu_dry_ref: 377.4
    eps_bed_cal_ref: 0.5306
  rho_bu_dry_ref_support:
    lower: 330.0
    upper: 410.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 270
    eps_bed_cal_ref: 0.66418124
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  - record_id: dense_high_density
    rho_bu_dry_ref: 610
    eps_bed_cal_ref: 0.24129836
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - sunflower_density_isik_izli_2007
    method: Select the complete rho-eps pair atomically. Never combine density and
      porosity from different source states.
    verification: mathematically_reproduced
    applicability:
      packing: Isik and Izli whole-seed record at 10.06% db; measured bulk mass density
        divided by 1+X_db while porosity remains unchanged under the paired bulk/true-density
        conversion.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete loose and dense packing records derived at the fixed reference
      inferred dry particle density.
    verification: mathematically_reproduced
thermal_properties:
  k_gr:
    nominal: 0.2
    support:
      lower: 0.16
      upper: 0.3
    transform: log
    distribution: uniform_in_log_space
    provenance:
      evidence: engineering_inversion
      source_refs:
      - sunflower_thermal_ince_2008
      method: Dry granular-phase conductivity selected by inverting the binding Maxwell-Eucken
        relation so the packed effective conductivity matches the low-moisture sunflower
        measurements near VP2 temperatures.
    ood_supports:
    - lower: 0.1
      upper: 0.13
    - lower: 0.38
      upper: 0.5
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy; permeability tails also satisfy fixed Kozeny-Carman
        guards.
      verification: mathematically_reproduced
  cp_gr_dry:
    nominal: 700.0
    support:
      lower: 500.0
      upper: 1000.0
    transform: log
    distribution: uniform_in_log_space
    provenance:
      evidence: engineering_conversion
      source_refs:
      - sunflower_thermal_ince_2008
      method: The source reports wet-product heat capacity. The nominal was converted
        to the model dry-solid basis after removing the explicit X_db*cp_w contribution
        at low moisture and 25-40 degC; this avoids double counting water heat capacity.
    ood_supports:
    - lower: 300
      upper: 400
    - lower: 1200
      upper: 1500
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy; permeability tails also satisfy fixed Kozeny-Carman
        guards.
      verification: mathematically_reproduced
