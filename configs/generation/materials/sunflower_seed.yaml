        guards.
      verification: mathematically_reproduced
  amplitude_db:
    nominal: 0.015
    support:
      lower: 0.003
      upper: 0.03
    transform: linear
    distribution: uniform
    provenance:
      evidence: synthetic_design
      source_refs:
      - sunflower_sorption_drying_munder_2019
    ood_supports:
    - lower: 0.042
      upper: 0.06
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy; permeability tails also satisfy fixed Kozeny-Carman
        guards.
      verification: mathematically_reproduced
  field_support:
    lower: 0.0989010989010989
    upper: 0.2195121951219512
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - sunflower_sorption_drying_munder_2019
      method: X_db=X_wb/(1-X_wb)
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
target_moisture:
  selected_simulation_target_wb: 0.06
  market_acceptance_moisture_wb: 0.06
  safe_storage_moisture_wb: 0.06
  provenance:
    evidence: official_industry_target
    source_refs:
    - swiss_oil_2026
oswin:
  record_id: sunflower_seed_production_oswin_v1
  components:
    A_osw: 4.8
    B_osw: -0.0158
    C_osw: 0.622278
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical B is per kelvin or per degree
    Celsius increment
  provenance:
    evidence: literature_convention_conversion
    source_refs:
    - sunflower_sorption_drying_munder_2019
    method: Exact equation-convention conversion into the binding A/B/C form; no new
      fit and no coefficient mixing are claimed.
    applicability:
      moisture_basis: kg water/kg dry solids; source kg/kg dry-matter coefficient
        scale converted to the binding percent-db prefactor
      evidence_scope: Whole high-oleic hull-intact sunflower seed; 25-50 degC and
        aw 0.10-0.95.
two_compartment_kinetics:
  record_id: sunflower_seed_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 1.0e-05
      support:
        lower: 5.0e-06
        upper: 1.8e-05
      transform: log
    r_int_surf:
      nominal: 0.15
      support:
        lower: 0.10
        upper: 0.3
      transform: log
    f_surf:
      nominal: 0.45
      support:
        lower: 0.25
        upper: 0.65
      transform: logit
  ood_records:
  - record_id: slow_internal_limited
    r_surf_0: 2.5e-06
    r_int_surf: 0.075
    f_surf: 0.3
  - record_id: fast_surface_exposed
    r_surf_0: 3.5e-05
    r_int_surf: 0.225
    f_surf: 0.6
  selection_rule: complete_record_atomic
  provenance:
    evidence: hierarchical_engineering_prior
    source_refs:
    - sunflower_sorption_drying_munder_2019
    applicability:
      evidence_scope: A desired nominal drying duration, or preferably independent
        whole-seed X_db(t) curves at known T, RH/omega and airflow.
      limitation: Kinetics were conservatively aligned using a limited numerical pilot
        to reduce seven-day right-censoring and produce informative neural-operator
        transients; they were not fitted to experiments or validated as real drying-time
        predictions, and sunflower remains an engineering stress-test material.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete slow and fast records follow the common nominal-multiplier kinetics
      stress design equation.
    verification: mathematically_reproduced
