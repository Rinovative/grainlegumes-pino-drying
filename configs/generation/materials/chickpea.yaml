        db, MRE 0.7516%, R2 0.99771. Statistics calculated here.'
    confidence: high
    validity:
      material_scope_ref: material_scope
      product_form: Whole mature dry Kabuli chickpea
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted by 0.01
      equation_or_method: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
      supplied_scope: 15-35 degC, source desorption 8.9-16.9% db; fit evaluated over RH 0.30-0.80
