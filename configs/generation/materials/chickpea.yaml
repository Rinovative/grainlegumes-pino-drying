schema_kind: generation_material
schema_version: 1
material_family: chickpea
material_scope:
  common_name: Chickpea
  species: Cicer arietinum L.
  market_class: kabuli
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature dry Kabuli chickpea
permeability:
  nominal: 1.43e-08
  support:
    lower: 8.0e-09
    upper: 3.0e-08
  transform: log
  distribution: uniform_in_log_space
  ood_supports:
  - lower: 2.5e-09
    upper: 5.0e-09
  - lower: 4.8e-08
    upper: 8.0e-08
  provenance:
    evidence: project_baseline
    source_refs:
    - ba
    applicability:
      packing: Only for packing bands in each complete density record; generated mean eps must pass the material band.
packing_porosity_mean_support:
  lower: 0.37
  upper: 0.45
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - chickpea_physical
    method: Select a complete record atomically. Never combine rho from one source/record with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole black-Kabuli density/porosity relation evaluated near 13% db; range widened for Kabuli cultivar and packing
        transfer.
density_calibration:
  record_id: chickpea_density_calibration_v1
  reference:
    rho_bu_dry_ref: 676.0
    eps_bed_cal_ref: 0.403
  rho_bu_dry_ref_support:
    lower: 620.0
    upper: 730.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 505.0
    eps_bed_cal_ref: 0.55401627
    basis: same inferred dry particle density as reference; alternate complete packing record
  - record_id: dense_high_density
    rho_bu_dry_ref: 855.0
    eps_bed_cal_ref: 0.24491864
    basis: same inferred dry particle density as reference; alternate complete packing record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - chickpea_physical
    method: Select a complete record atomically. Never combine rho from one source/record with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole black-Kabuli density/porosity relation evaluated near 13% db; range widened for Kabuli cultivar and packing
        transfer.
thermal_properties:
  k_gr:
    nominal: 0.3
    support:
      lower: 0.24
      upper: 0.38
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 0.16
      upper: 0.2
    - lower: 0.46
      upper: 0.58
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
  cp_gr_dry:
    nominal: 1900.0
    support:
      lower: 1600.0
      upper: 2200.0
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 1200.0
      upper: 1450.0
    - lower: 2500.0
      upper: 2900.0
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
initial_moisture:
  mean_db:
    nominal: 0.25
    support:
      lower: 0.1904761904761905
      upper: 0.3157894736842105
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.36
      upper: 0.45
    provenance:
      evidence: engineering_estimate
      source_refs:
      - ba
      note: Natural material-dependent starting moisture in dry basis; range is an explicit engineering envelope around project
        or product-compatible drying evidence, not a market-target transfer.
  amplitude_db:
    nominal: 0.02
    support:
      lower: 0.005
      upper: 0.04
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.055
      upper: 0.08
    provenance:
      evidence: synthetic_design
      source_refs:
      - pino_airflow_project
  field_support:
    lower: 0.1904761904761905
    upper: 0.3157894736842105
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - ba
      method: X_db=X_wb/(1-X_wb)
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
target_moisture:
  selected_simulation_target_wb: 0.12
  market_acceptance_moisture_wb: 0.135
  safe_storage_moisture_wb: 0.11923
  provenance:
    evidence: derived
    source_refs:
    - swiss_crops
    note: Selected simulation stop target; market, safe-storage and selected values remain separate.
oswin:
  record_id: chickpea_production_oswin_v1
  components:
    A_osw: 11.21749504
    B_osw: -0.06156313
    C_osw: 0.49141999
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or per degree Celsius increment
  provenance:
    evidence: literature_fit
    source_refs:
    - chickpea_oswin_source
    method: 'Re-fit of 2402 reconstructed modified-Henderson source-surface points: RMSE 0.10895 percentage points db, MRE
      0.7516%, R2 0.99771. Statistics calculated here.'
    applicability:
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted by 0.01
      evidence_scope: 15-35 degC, source desorption 8.9-16.9% db; fit evaluated over RH 0.30-0.80
two_compartment_kinetics:
  record_id: chickpea_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 7.0e-06
      support:
        lower: 3.0e-06
        upper: 1.4e-05
      transform: log
    r_int_surf:
      nominal: 0.15
      support:
        lower: 0.06
        upper: 0.3
      transform: log
    f_surf:
      nominal: 0.45
      support:
        lower: 0.28
        upper: 0.62
      transform: logit
  ood_records:
  - record_id: slow_internal_limited
    r_surf_0: 1.75e-06
    r_int_surf: 0.075
    f_surf: 0.30000000000000004
  - record_id: fast_surface_exposed
    r_surf_0: 2.45e-05
    r_int_surf: 0.22499999999999998
    f_surf: 0.6
  selection_rule: complete_record_atomic
  provenance:
    evidence: calibration_prior
    source_refs:
    - chickpea_drying
    applicability:
      evidence_scope: independent whole-particle X_db(t) or moisture-ratio curves at known T, RH/omega, airflow and product
        state; T(t) if available
      limitation: use pilot nominal, run only engineering preflight, treat as a calibration prior and do not claim experimental
        validation
