schema_kind: generation_campaign
schema_version: 1
campaign_purpose: family_generalization
sources_config: configs/generation/sources.yaml
registry_config: configs/generation/registry.yaml
common_config: configs/generation/common.yaml
operations_config: configs/generation/operations/fixed_bed.yaml
profile_config: configs/generation/profiles/transient_drying.yaml
execution_config: configs/generation/execution/cluster_cpu.yaml
material_roles:
  seen:
  - lentil
  - chickpea
  - kidney_bean
  near_family_ood:
  - field_pea
  far_family_ood:
  - rapeseed
  extreme_family_ood:
  - sunflower_seed
sampling:
  method: lhs
  seed_base: 9200
  counts:
    natural:
      lentil: 160
      chickpea: 160
      kidney_bean: 160
      field_pea: 40
      rapeseed: 40
      sunflower_seed: 40
    parameter_ood:
      lentil: 0
      chickpea: 0
      kidney_bean: 0
membership:
  seed: 9250
  per_seen_material:
    train: 128
    validation: 16
    id_test: 16
dataset_packages:
# Transient-Drying-Pakete
- dataset_view: transient_drying
  evaluation_regime: id
  source_role: seen
  training_payload:
    backend: pt_shards
    required: true
- dataset_view: transient_drying
  evaluation_regime: near_family_ood
  source_role: near_family_ood
  training_payload:
    backend: pt_shards
    required: true
- dataset_view: transient_drying
  evaluation_regime: far_family_ood
  source_role: far_family_ood
  training_payload:
    backend: pt_shards
    required: true
- dataset_view: transient_drying
  evaluation_regime: extreme_family_ood
  source_role: extreme_family_ood
  training_payload:
    backend: pt_shards
    required: true
# Steady-Flow-View aus denselben transienten HDF5-Fällen
- dataset_view: steady_flow
  evaluation_regime: id
  source_role: seen
- dataset_view: steady_flow
  evaluation_regime: near_family_ood
  source_role: near_family_ood
- dataset_view: steady_flow
  evaluation_regime: far_family_ood
  source_role: far_family_ood
- dataset_view: steady_flow
  evaluation_regime: extreme_family_ood
  source_role: extreme_family_ood