# Non-scientific infrastructure smoke only. These values are not a material family.
schema_version: 1
simulation_profile: steady_flow
cases:
  indices: [1]
  seed_base: 3001
  overrides: {}
generator:
  version: python_multiscale_v1
  domain:
    length_x_m: 0.04
    length_y_m: 0.03
    resolution_m: 0.01
  parameters:
    base_len_rel: 0.20
    smooth_len_rel: 0.10
    ms_weight: [0.3, 0.7]
    anisotropy: [2.0, 1.0]
    coupling: 0.5
    noise_level: 0.0
    noise_granularity: 0.5
    noise_bias: 0.5
    k_mean: 5.0e-9
    var_rel: 0.5
    a_max: 2.0
    a_gamma: 2.0
    tensor_strength: 1.0
    theta_jitter: 0.0
    theta_smooth_rel: 0.1
    A_rel: 2.0
    eps_min_global: 0.3
    eps_max_global: 0.8
    eps_smooth_rel: 0.05
    texture_amp: 0.005
    p_inlet_mean: 350.0
    a_sin: 0.03
    f_sin: 0.75
    phi_sin: 3.141592653589793
    k_gauss: 2
    a_gauss: 0.05
    sigma_gauss: 0.05
    gauss_jitter: 0.25
    a_lin: 0.025
sampling: null
inputs:
  spatial_files:
    - filename: case_0001.csv
      delimiter: ";"
      columns: [x, y, Kxx, Kxy, Kyy, eps, p_bc]
exports:
  root: exports
  contracts:
    - role: steady_flow_fields
      pattern: airflow.csv
      required: true
      allow_multiple: false
      format: numeric_table
      delimiter: ";"
      columns:
        x: x
        y: y
        p: p
        u: u
        v: v
execution:
  executable: null
  timeout_seconds: 3600
  retain_solved_model: false
  extra_arguments: []
cluster:
  config_path: configs/generation/cluster_cpu.yaml
