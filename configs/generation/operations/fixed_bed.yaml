schema_kind: generation_operations
schema_version: 1
operation_id: fixed_bed
constraints:
  heater_only: true
  humidity_ratio_conserved: omega_source_air(t)=omega_in_bc(t)
  source_relative_humidity: RH(T_amb,omega_in_bc(t),p_ref)
  inlet_relative_humidity: RH(T_in_bc(t),omega_in_bc(t),p_ref)
  infeasible_schedule_policy: reject_complete_schedule_and_deterministically_resample
  porosity_natural_support_policy: realized_mean_must_retain_natural_or_kappa_mean_ood_state
boundary_schedule:
  startup_ramp:
    enabled: true
    duration_h: 0.5
    initial_equilibrium_rh_dry_margin: 0.05
    max_relative_humidity: 0.90
parameter_values:
  pressure_bc.mean:
    lower: 250.0
    upper: 750.0
    ood:
    - lower: 900.0
      upper: 1200.0
    nominal: 500.0
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: project_baseline
      source_refs:
      - pino_airflow_project
      note: Not redundant; strongest VP1 scalar association. The low-pressure tail is rejected because its stable support
        would be narrow relative to ID.
  pressure_bc.sin_amp:
    lower: -0.02
    upper: 0.02
    ood:
    - lower: -0.05
      upper: -0.03
    - lower: 0.03
      upper: 0.05
    nominal: 0.0
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: project_baseline
      source_refs:
      - pino_airflow_project
      note: Can overlap Gaussian and linear shapes; field-level orthogonality monitor recommended.
  pressure_bc.sin_freq:
    lower: 0.5
    upper: 1.5
    ood:
    - lower: 2.0
      upper: 3.0
    nominal: 1.0
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: project_baseline
      source_refs:
      - pino_airflow_project
      note: Low when sinusoidal amplitude is near zero; conditional sensitivity. The short low-frequency tail is rejected
        by the tail-width rule.
  pressure_bc.sin_phase:
    lower: 0.0
    upper: 6.283185307179586
    nominal: 3.141592653589793
    distribution: circular_uniform_on_[0,2*pi)
    provenance:
      evidence: synthetic_design
      source_refs:
      - pino_airflow_project
      note: No disjoint physical tail exists on a complete circle.
  pressure_bc.gauss_count:
    lower: 1
    upper: 5
    ood:
    - lower: 7.0
      upper: 9.0
    nominal: 3
    distribution: discrete_uniform_inclusive
    provenance:
      evidence: project_baseline
      source_refs:
      - pino_airflow_project
      note: Interacts with Gaussian width/amplitude.
  pressure_bc.gauss_amp:
    lower: -0.06
    upper: 0.06
    ood:
    - lower: -0.14
      upper: -0.09
    - lower: 0.09
      upper: 0.14
    nominal: 0.0
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: project_baseline
      source_refs:
      - pino_airflow_project
      note: Interacts with count and width.
  pressure_bc.gauss_width:
