    nominal: 2.5
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: synthetic_design
      source_refs:
      - ba
      note: Exact symmetric maximum deviation widened to create a random lower-temperature tail; complete infeasible schedules are rejected without clipping.
