# Role: Slurm resources, timeouts, retries and retention of Generation node jobs. Edit: when cluster use or limits change.
# Measurements behind the values: docs/03_generation.md. These fields do not set the physical simulation duration.
# Derived, not authored: concurrent_cases_per_node = site.cores_per_node // run.cores_per_case; node job memory = concurrent_cases_per_node * node_job.memory_per_case + node_job.node_memory_overhead.
schema_kind: generation_execution
run:  # What changes per Generation run; node_jobs, cores_per_case, timeout_seconds and max_admission_cases also have CLI flags.
  node_jobs: 2  # Concurrent node jobs across all runs, 1 to 4 (per-user cap on the shared standard nodes).
  cores_per_case: 4  # CPU cores of one case step (k); concurrency per node job is site.cores_per_node // k.
  timeout_seconds: 3600  # Per-case wrapper limit in seconds; the orderly stop starts internals.graceful_stop_reserve_seconds earlier.
  retention: compact  # compact keeps canonical outputs and essential evidence; full also keeps the solved model and raw exports.
  max_admission_cases: 4  # Cap on the cumulative distinct fresh cases admitted (a stage and safety limit, not concurrency); a Dataset run without the flag derives it from its plan.
rules:  # Failure and wait policies.
  stall_stop:  # Transient cases only; stops a case whose simulated time is still below the minimum after the check time (reason stalled).
    check_after_seconds: 900  # Solving time after which the simulated time is checked.
    minimum_simulated_seconds: 3600  # Simulated time a case must have reached at the check.
  license_wait:  # A licence-capacity failure (batch seat unavailable) waits and is redispatched instead of counting as a case failure.
    enabled: true  # false (also --no-retry) turns off the wait and the retry inside the allocation; a capacity failure then fails the case.
    maximum_wait_seconds: 3600  # Cumulative wait per case, positive and never unbounded; the pipeline fixes the backoff and the in-allocation window.
  extra_arguments: []  # Additional COMSOL arguments; the pipeline owns the batch, parameter, log and licence arguments and rejects them here.
node_job:  # Slurm resources of one node job (one whole node, concurrent case steps of run.cores_per_case cores each).
  node_job_wall_time: "08:00:00"  # Slurm time of one node job, at most 24:00:00; must exceed run.timeout_seconds plus 600 s.
  memory_per_case: 20G  # Memory limit of one case step (<int>M|G|T).
  node_memory_overhead: 8G  # Node-job memory on top of the case steps for the worker and its shell.
  node_memory_limit: 500G  # Upper bound of one node job's memory; a larger need is rejected, the concurrency is never reduced.
  scheduler_options: []  # Extra long sbatch flags; memory, dependency, comment, node selection, GPUs and the allocation shape are pipeline-owned.
site:  # The cluster; rarely changes.
  partition: standard  # Slurm partition of the node jobs.
  cores_per_node: 32  # CPUs one node job requests (not exclusive); caps run.cores_per_case.
  comsol_module: Comsol/v6.4  # Environment module loaded for COMSOL in the node jobs.
  comsol_executable: comsol  # COMSOL executable used in the node jobs.
  python_executable: /usr/bin/python3.12  # Python executable used in the node jobs.
internals:  # Pipeline internals.
  poll_interval_seconds: 15  # Controller polling interval in seconds.
  graceful_stop_reserve_seconds: 300  # Part of run.timeout_seconds reserved for an orderly stop.
