# Role: Smoke profile of a transient Source campaign in node mode: four cases (two lentil, two chickpea) with the production execution config, about 30 min. Edit: rarely.
# Proves the campaign path on ICE (node job per node-job slot, cases as job steps, dispatch records, evidence, completion) before a production campaign; four cases match the default admission cap.
schema_kind: generation_source_campaign
schema_version: 1
sources_config: configs/01_generation/physical_model/sources.yaml
registry_config: configs/01_generation/physical_model/registry.yaml
common_config: configs/01_generation/physical_model/common.yaml
operations_config: configs/01_generation/physical_model/fixed_bed.yaml
profile_config: configs/01_generation/physical_model/profiles/transient_drying.yaml
execution_config: configs/01_generation/execution.yaml
# Own design stream (seed 9201), so the smoke never shares a campaign name with the production campaign; two cases per material.
sampling:
  method: lhs
  seed_base: 9201
  counts:
    natural:
      lentil: 2
      chickpea: 2
materials:
- lentil
- chickpea
domain_profile: reference_range  # Selects natural-support/OOD branch semantics; this label does not assign learning or evaluation roles.
