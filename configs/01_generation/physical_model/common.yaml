# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Shared Generation model and storage settings: grid, output times, fixed physical values, then tolerances. The formula contract,
# input-file adapters and the fixed time and storage fields are owned by the loader (src/generation/cases/generation_cases_config.py).
schema_kind: generation_common
# Boundary-inclusive output grid: nx and ny are point counts; Lx, Ly, and Lz are physical dimensions in metres.
grid:
  nx: 401
  ny: 251
  Lx: 1.2
  Ly: 0.75
  Lz: 0.8
  boundaries_included: true
grid_provenance:
  nx:
    evidence: synthetic_design
    source_refs:
    - transient_comsol_model_report
  ny:
    evidence: synthetic_design
    source_refs:
    - transient_comsol_model_report
  Lx:
    evidence: synthetic_design
    source_refs:
    - transient_comsol_model_report
  Ly:
    evidence: synthetic_design
    source_refs:
    - transient_comsol_model_report
  Lz:
    evidence: synthetic_design
    source_refs:
    - transient_comsol_model_report
  dx:
    evidence: derived
    source_refs:
    - transient_comsol_model_report
    method: Boundary-inclusive output spacing Lx/(Nx-1).
    verification: mathematically_reproduced
  dy:
    evidence: derived
    source_refs:
    - transient_comsol_model_report
    method: Boundary-inclusive output spacing Ly/(Ny-1).
    verification: mathematically_reproduced
  boundaries_included:
    evidence: project_baseline
    source_refs:
    - pino_airflow_project
# Physical output horizon and sampling interval in hours: saved output times, not internal (adaptive) solver steps.
time:
  start: 0.0
  stop: 168.0
  interval: 1.0
time_provenance:
  start:
    evidence: project_baseline
    source_refs:
    - transient_comsol_model_report
  stop:
    evidence: synthetic_design
    source_refs:
    - transient_comsol_model_report
  interval:
    evidence: synthetic_design
    source_refs:
    - transient_comsol_model_report
# Fixed model constants and boundary limits shared by the selected profile; units and provenance are attached to each value.
scientific_fixed_values:
  # Reference temperature used to condition the stationary airflow template.
  T_flow_ref:
    value: 300.65
    unit: K
    provenance:
      evidence: synthetic_design
      source_refs:
      - transient_comsol_model_report
  # Reference absolute pressure used for psychrometric conversions.
  p_ref:
    value: 101325.0
    unit: Pa
    provenance:
      evidence: project_baseline
      source_refs:
      - transient_comsol_model_report
  # Outlet pressure boundary for the stationary airflow model.
  p_out:
    value: 0.0
    unit: Pa
    provenance:
      evidence: project_baseline
      source_refs:
      - transient_comsol_model_report
  # Lower admissible inlet temperature for the regular operating schedule.
  T_in_min:
    value: 290.15
    unit: K
    provenance:
      evidence: synthetic_design
      source_refs:
      - ba
      note: Regular inlet lower bound selected to admit stochastic lower-heating intervals while retaining heater-only and psychrometric rejection.
  # Upper admissible inlet temperature for the regular operating schedule.
  T_in_max:
    value: 313.15
    unit: K
    provenance:
      evidence: synthetic_design
      source_refs:
      - ba
      applicability:
        general: quality-preserving hard bound for whole pulses/oilseed pilot
  # Lower hard bound on inlet humidity ratio, in kg water/kg dry air.
  omega_min:
    value: 0.0025
    unit: kg/kg
    provenance:
      evidence: engineering_estimate
      source_refs:
      - transient_comsol_model_report
    boundary:
      boundary_kind: engineering_source_air_envelope
      boundary_basis: source_air_dew_point_range
      hard_boundary: true
  # Upper hard bound on inlet humidity ratio, in kg water/kg dry air.
  omega_max:
    value: 0.0145
    unit: kg/kg
    provenance:
      evidence: engineering_estimate
      source_refs:
      - transient_comsol_model_report
    boundary:
      boundary_kind: engineering_source_air_envelope
      boundary_basis: source_air_dew_point_range
      hard_boundary: true
  # Physical operating lower bound for relative humidity.
  phi_operational_min:
    value: 0.05
    unit: '1'
    provenance:
      evidence: synthetic_design
      source_refs:
      - transient_comsol_model_report
  # Physical operating upper bound for relative humidity.
  phi_operational_max:
    value: 0.85
    unit: '1'
    provenance:
      evidence: synthetic_design
      source_refs:
      - transient_comsol_model_report
  # Numerical relative-humidity lower clip used in equilibrium and model expressions; phi is RH (dimensionless).
  phi_clip_min:
    value: 1.0e-06
    unit: '1'
    provenance:
      evidence: synthetic_design
      source_refs:
      - transient_comsol_model_report
  # Numerical relative-humidity upper clip used in equilibrium and model expressions near saturation; phi is RH (dimensionless).
  phi_clip_max:
    value: 0.999
    unit: '1'
    provenance:
      evidence: synthetic_design
      source_refs:
      - transient_comsol_model_report
  # Water specific heat used in the granular effective heat capacity.
  cp_w:
    value: 4180.0
    unit: J/(kg*K)
    provenance:
      evidence: project_baseline
      source_refs:
      - transient_comsol_model_report
      applicability:
        general: constant across 5-60 degC; no sampling dimension
  # Latent heat of vaporization used for the evaporation heat sink.
  h_fg:
    value: 2418200.0
    unit: J/kg
    provenance:
      evidence: project_baseline
      source_refs:
      - transient_comsol_model_report
      applicability:
        general: representative near 35 degC; deterministic T function is optional later, not sampled
  # Water-vapour diffusivity in air at the stated reference state.
  D_v_air:
    value: 2.811e-05
    unit: m^2/s
    provenance:
      evidence: project_baseline
      source_refs:
      - transient_comsol_model_report
      applicability:
        general: representative at T_flow_ref and p_ref; deterministic T,p function is optional later
  # Water-vapour molar mass used in gas-property conversions.
  M_v:
    value: 0.01801528
    unit: kg/mol
    provenance:
      evidence: literature_direct
      source_refs:
      - transient_comsol_model_report
  # Wall thickness used to derive the overall wall heat-transfer coefficient.
  d_wall:
    value: 0.019
    unit: m
    provenance:
      evidence: project_baseline
      source_refs:
      - ba
  # Wall thermal conductivity used in the wall resistance.
  k_wall:
    value: 0.13
    unit: W/(m*K)
    provenance:
      evidence: project_baseline
      source_refs:
      - ba
  # External wall-to-ambient heat-transfer coefficient.
  h_ext:
    value: 8.0
    unit: W/(m^2*K)
    provenance:
      evidence: engineering_estimate
      source_refs:
      - ba
      applicability:
        general: indoor quiescent-air engineering baseline
  # Derived overall wall heat-transfer coefficient from wall and external resistances.
  U_wall:
    unit: W/(m^2*K)
    provenance:
      evidence: derived
      source_refs:
      - transient_comsol_model_report
      method: Overall wall heat-transfer coefficient 1/(d_wall/k_wall+1/h_ext).
      verification: mathematically_reproduced
  # Maximum dry-mass fraction above the material moisture target used by the wet-fraction stopping criterion.
  f_wet_dm_max:
    value: 0.05
    unit: '1'
    provenance:
      evidence: synthetic_design
      source_refs:
      - transient_comsol_model_report
  # Interpolation rule for the persisted inlet schedule between its tabulated times.
  schedule_interpolation:
    value: linear
    unit: method
    provenance:
      evidence: synthetic_design
      source_refs: []
# Global physical admissibility bounds used alongside material-specific support; they do not replace those material records.
parameter_values:
  eps_min_global:
    value: 0.2
    nominal: 0.2
    provenance:
      evidence: project_baseline
      source_refs:
      - pino_airflow_project
  eps_max_global:
    value: 0.8
    nominal: 0.8
    provenance:
      evidence: project_baseline
      source_refs:
      - pino_airflow_project
# Relative and absolute tolerances for distinct generated-state consistency checks.
validation:
  transient_initial_state:
    rtol: 1.0e-04
    atol: 1.0e-10
  transient_bulk_moisture:
    rtol: 1.0e-05
    atol: 1.0e-09
# Processed-output layout (HDF5 gzip level and chunks). Float32 tolerances govern conversion fidelity, not solver accuracy.
storage:
  compression_level: 4
  shuffle: true
  float32_rtol: 1.0e-06
  float32_atol: 1.0e-12
  chunk_time: 1
  chunk_y: 64
  chunk_x: 64
