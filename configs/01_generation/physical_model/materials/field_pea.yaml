# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Material-specific physical design in edit order: sampled values, density, Oswin, target, kinetics. Nominals/supports are parameterization choices, not universal constants.
schema_kind: generation_material
material_family: field_pea
material_scope:
  common_name: Field pea
  species: Pisum sativum L.
  market_class: yellow_or_green_field_pea
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature dry field pea
# The permeability scale kappa_mean is in m^2. Natural support and transform define sampling; ood_supports are separate synthetic stress intervals.
permeability:
  nominal: 1.65e-08
  support:
    lower: 8.0e-09
    upper: 4.0e-08
  transform: log
  distribution: uniform_in_log_space
  ood_supports:
  - lower: 2.4e-09
    upper: 5.2e-09
  - lower: 6.4e-08
    upper: 1.1e-07
  provenance:
    evidence: literature_transfer
    source_refs:
    - ba
    applicability:
      packing: Only for packing bands in each complete density record; generated mean
        eps must pass the material band.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Explicit synthetic stress intervals admitted by the registry-wide transformed
      gap and width policy; permeability tails also satisfy fixed Kozeny-Carman guards.
    verification: mathematically_reproduced
# Granular-phase thermal values: k_gr is conductivity and cp_gr_dry is dry-solid specific heat. Natural and OOD supports are design ranges.
thermal_properties:
  k_gr:
    nominal: 0.31
    support:
      lower: 0.25
      upper: 0.38
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 0.16
      upper: 0.21
    - lower: 0.46
      upper: 0.58
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  cp_gr_dry:
    nominal: 1950.0
    support:
      lower: 1650.0
      upper: 2250.0
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 1200
      upper: 1500
    - lower: 2550
      upper: 2950
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
# Initial moisture is dry basis (kg water/kg dry solids); amplitude controls field variation and field_support bounds generated values.
initial_moisture:
  mean_db:
    nominal: 0.25
    support:
      lower: 0.1904761904761905
      upper: 0.3157894736842105
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.36
      upper: 0.45
    provenance:
      evidence: engineering_estimate
      source_refs:
      - pea_drying
      note: Natural material-dependent starting moisture in dry basis; range is an
        explicit engineering envelope around project or product-compatible drying
        evidence, not a market-target transfer.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  amplitude_db:
    nominal: 0.02
    support:
      lower: 0.005
      upper: 0.04
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.055
      upper: 0.08
    provenance:
      evidence: synthetic_design
      source_refs:
      - pino_airflow_project
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  field_support:
    lower: 0.1904761904761905
    upper: 0.3157894736842105
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - pea_drying
      method: X_db=X_wb/(1-X_wb)
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
# Dimensionless support for generated bed-mean porosity; density calibration stores a compatible paired reference state.
packing_porosity_mean_support:
  lower: 0.37
  upper: 0.43
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - pea_physical
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Yalcin et al. wet bulk density and porosity regressions evaluated at
        20% db; dry bulk density calculated as rho_wet/(1+Xdb).
# Dry bulk-density calibration and paired bed porosity define the material reference used for packing/density consistency. OOD records are complete alternatives selected atomically.
density_calibration:
  record_id: field_pea_density_calibration_v1
  reference:
    rho_bu_dry_ref: 568.1
    eps_bed_ref: 0.3938
  rho_bu_dry_ref_support:
    lower: 530.0
    upper: 620.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 430
    eps_bed_ref: 0.54116177
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  - record_id: dense_high_density
    rho_bu_dry_ref: 710
    eps_bed_ref: 0.24238338
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - pea_physical
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Yalcin et al. wet bulk density and porosity regressions evaluated at
        20% db; dry bulk density calculated as rho_wet/(1+Xdb).
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete loose and dense packing records derived at the fixed reference
      inferred dry particle density.
    verification: mathematically_reproduced
# Coupled Oswin equilibrium-isotherm coefficients; preserve each material record and its stated units/evidence as one parameter set.
oswin:
  record_id: field_pea_production_oswin_v1
  components:
    A_osw: 12.06202053
    B_osw: -0.0573838
    C_osw: 0.34338283
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or
    per degree Celsius increment
  provenance:
    evidence: literature_transfer
    source_refs:
    - lentil_oswin_source
    applicability:
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted
        by 0.01
      evidence_scope: Transferred as the complete lentil tuple to whole field pea;
        direct pea literature supports modified Oswin but accessible full coefficients
        were unavailable.
    note: No pea-specific re-fit claimed. Validate against Garg and Chandra pea data
      before production.
# Single operational drying target on a wet basis; it is a material target, not an initial-moisture support.
target_moisture:
  target_moisture_wb: 0.12
  provenance:
    evidence: derived
    source_refs:
    - swiss_crops
    method: Exact safe-storage reference 0.11894 wb, rounded to the nearest whole
      wet-basis percentage point.
    verification: mathematically_reproduced
    note: Single practical safe-storage drying target; market acceptance is not
      an operational target.
# Surface/internal moisture-transfer prior: r_surf_0 is a rate, r_int_surf a rate ratio, f_surf a fraction; the loader derives the two OOD records from the nominals.
two_compartment_kinetics:
  record_id: field_pea_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 1.4e-05
      support:
        lower: 7.0e-06
        upper: 2.2e-05
      transform: log
    r_int_surf:
      nominal: 0.16
      support:
        lower: 0.10
        upper: 0.3
      transform: log
    f_surf:
      nominal: 0.46
      support:
        lower: 0.28
        upper: 0.62
      transform: logit
  selection_rule: complete_record_atomic
  provenance:
    evidence: calibration_prior
    source_refs:
    - pea_drying
    applicability:
      evidence_scope: independent whole-particle X_db(t) or moisture-ratio curves
        at known T, RH/omega, airflow and product state; T(t) if available
      limitation: Kinetics were conservatively aligned using a limited numerical pilot
        to reduce seven-day right-censoring and produce informative neural-operator
        transients; they were not fitted to experiments or validated as real drying-time
        predictions.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete slow and fast records follow the common nominal-multiplier kinetics
      stress design equation.
    verification: mathematically_reproduced
