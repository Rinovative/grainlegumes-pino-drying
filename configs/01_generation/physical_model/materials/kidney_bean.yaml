# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Material-specific physical design in edit order: sampled values, density, Oswin, target, kinetics. Nominals/supports are parameterization choices, not universal constants.
schema_kind: generation_material
material_family: kidney_bean
material_scope:
  common_name: Kidney bean
  species: Phaseolus vulgaris L.
  market_class: red_kidney
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature dry red kidney bean
# The permeability scale kappa_mean is in m^2. Natural support and transform define sampling; ood_supports are separate synthetic stress intervals.
permeability:
  nominal: 3.63e-08
  support:
    lower: 1.5e-08
    upper: 8.0e-08
  transform: log
  distribution: uniform_in_log_space
  ood_supports:
  - lower: 4.0e-09
    upper: 9.0e-09
  - lower: 1.3e-07
    upper: 2.2e-07
  provenance:
    evidence: engineering_estimate
    source_refs:
    - ba
    - chickpea_airflow_masoumi_tabil_2008
    method: Clean kidney-bean estimate without a K_A correction. The thesis measured clean red kidney beans (Tab. 17) at an apparent permeability of about 1.3e-08 m^2 at 0.14 m/s, but in a 41.5 mm tube only 2.7 bean lengths wide, which probably reads low. Ergun with the thesis porosity 0.47 and an effective diameter of 0.75 x 8.97 mm gives 4.8e-08 m^2, and clean Kabuli chickpeas of similar size give 3.0-5.0e-08 m^2 (Masoumi and Tabil 2008, Table 2), so the value is plausible but not measured.
    applicability:
      packing: Only for packing bands in each complete density record; generated mean
        eps must pass the material band.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Explicit synthetic stress intervals admitted by the registry-wide transformed
      gap and width policy; permeability tails also satisfy fixed Kozeny-Carman guards.
    verification: mathematically_reproduced
# Granular-phase thermal values: k_gr is conductivity and cp_gr_dry is dry-solid specific heat. Natural and OOD supports are design ranges.
thermal_properties:
  k_gr:
    nominal: 0.32
    support:
      lower: 0.25
      upper: 0.4
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 0.16
      upper: 0.21
    - lower: 0.49
      upper: 0.62
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
      method: Value unchanged, an estimate transferred from lentil and faba bean, the only grains Matouk et al. (2018) cover. No bed values of Phaseolus beans were accessible (Thomeo et al. 2004 is restricted), and the bed values of lentil and chickpea (Oke 2021, Table 4.7) give grain conductivities of 0.19-0.28 W/(m*K) with the Maxwell-Eucken relation, so the value is uncertain.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  cp_gr_dry:
    nominal: 1900.0
    support:
      lower: 1600.0
      upper: 2200.0
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 1200.0
      upper: 1450.0
    - lower: 2500.0
      upper: 2900.0
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
      method: Value unchanged, transferred from lentil and faba bean, the only grains Matouk et al. (2018) cover; no kidney-bean data were found. A Choi-Okos estimate from an assumed composition gives about 1.75 kJ/(kg*K) dry basis, inside the support.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
# Initial moisture is dry basis (kg water/kg dry solids); amplitude controls field variation and field_support bounds generated values.
initial_moisture:
  mean_db:
    nominal: 0.21951219512195122
    support:
      lower: 0.1904761904761905
      upper: 0.28205128205128205
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.3
      upper: 0.35
    provenance:
      evidence: literature_direct
      source_refs:
      - manitoba_field_beans
      - saskpulse_storage
      method: Values unchanged. Dry beans are combined at 16-22 % moisture and combining starts at 18-22 % (Manitoba Agriculture field-beans guidance; SaskPulse 2025, section Seed Moisture Content at Harvest); below 16 % the seed splits. The BA Table 7 reference record is at 18 %. No Swiss or Central European harvest data for dry beans were found. The OOD range 23.1-25.9 % wb lies above the recommended combining window and is a stress test.
      note: Natural material-dependent starting moisture in dry basis, not a market-target transfer.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  amplitude_db:
    nominal: 0.025
    support:
      lower: 0.006
      upper: 0.05
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.065
      upper: 0.095
    provenance:
      evidence: synthetic_design
      source_refs:
      - pino_airflow_project
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  field_support:
    lower: 0.17279069767441863
    upper: 0.33205128205128204
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - saskpulse_storage
      method: X_db=X_wb/(1-X_wb); lower bound is the target 0.14/0.86 (SaskPulse long-term storage moisture) plus the synthetic design margin margin_above_target_db 0.01, upper bound is the upper mean_db 0.22/0.78 plus the upper amplitude_db 0.05.
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
# Dimensionless support for generated bed-mean porosity; density calibration stores a compatible paired reference state.
packing_porosity_mean_support:
  lower: 0.42
  upper: 0.5
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - kidney_physical
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole white-kidney regression evaluated at 15.74% db and transferred
        to red kidney; project porosity 0.4727 is inside the retained band.
# Dry bulk-density calibration and paired bed porosity define the material reference used for packing/density consistency. OOD records are complete alternatives selected atomically.
density_calibration:
  record_id: kidney_bean_density_calibration_v1
  reference:
    rho_bu_dry_ref: 560.0
    eps_bed_ref: 0.456
  rho_bu_dry_ref_support:
    lower: 510.0
    upper: 620.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 415.0
    eps_bed_ref: 0.59685714
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  - record_id: dense_high_density
    rho_bu_dry_ref: 740.0
    eps_bed_ref: 0.28114286
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - kidney_physical
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole white-kidney regression evaluated at 15.74% db and transferred
        to red kidney; project porosity 0.4727 is inside the retained band.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete loose and dense packing records derived at the fixed reference
      inferred dry particle density.
    verification: mathematically_reproduced
# Coupled Oswin equilibrium-isotherm coefficients; preserve each material record and its stated units/evidence as one parameter set.
oswin:
  record_id: kidney_bean_production_oswin_v1
  components:
    A_osw: 14.07605
    B_osw: -0.0763
    C_osw: 0.46210721
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or
    per degree Celsius increment
  provenance:
    evidence: literature_transfer
    source_refs:
    - kidney_oswin_source
    method: Source modified-Oswin record A=14.07605, B=-0.07630 and c=2.16400; exact
      convention conversion C=1/c. Source reports R2=0.984, SEE=1.021 percentage points
      db, MRE=5.797%.
    applicability:
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted
        by 0.01
      evidence_scope: 20-50 degC, aw 0.3-0.9, intact whole common bean, desorption,
        % db
# Single operational drying target on a wet basis; it is a material target, not an initial-moisture support.
target_moisture:
  target_moisture_wb: 0.14
  provenance:
    evidence: derived
    source_refs:
    - swiss_crops
    - saskpulse_storage
    method: The Oswin fit of this material gives the equilibrium moisture 0.14315 wb at water activity 0.65 and 20 degC, the storage condition of swiss granum chapter 3. Chapter 3 is stated for cereals and Phaseolus beans do not appear in swiss granum, so this is a transfer. The target stays 0.14 wb, the SaskPulse long-term storage moisture of 14 % for beans (section Seed Moisture Content at Harvest).
    verification: mathematically_reproduced
    note: Single practical safe-storage drying target; market acceptance is not
      an operational target.
# Surface/internal moisture-transfer prior: r_surf_0 is a rate, r_int_surf a rate ratio, f_surf a fraction; the loader derives the two OOD records from the nominals.
two_compartment_kinetics:
  record_id: kidney_bean_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 1.05e-04
      support:
        lower: 4.94e-05
        upper: 1.85e-04
      transform: log
    r_int_surf:
      nominal: 0.1
      support:
        lower: 0.08
        upper: 0.22
      transform: log
    f_surf:
      nominal: 0.38
      support:
        lower: 0.22
        upper: 0.55
      transform: logit
  selection_rule: complete_record_atomic
  provenance:
    evidence: calibration_prior
    source_refs:
    - kidney_drying
    - bean_drying_afonso_correa_1999
    method: No comparable kidney-bean drying time exists (Doymaz 2016 starts at 53 % wb). r_surf_0 is taken from the same genus (fresh black bean Phaseolus vulgaris, 35 degC, Afonso Junior and Correa 1999, Table 1), matched at the moisture ratio of the target at the pilot air (35 degC, relative humidity 0.215), 1.46-1.57e-04, and scaled to the kidney Sauter diameter 6.51 mm (BA Table 7) against about 5.2 mm of the black bean with an exponent of 1 to 2, giving 0.80-1.53e-04 and 1.05e-04 as the centre. The support 4.94e-05 to 1.85e-04 is the nominal value times 0.47 and 1.76. The thin-layer time to the target at pilot air is 5.4 h. r_int_surf and f_surf are unchanged; the shape fit of the black-bean curve (0.115 and 0.33) is consistent with them.
    applicability:
      evidence_scope: independent whole-particle X_db(t) or moisture-ratio curves
        at known T, RH/omega, airflow and product state; T(t) if available
      limitation: Transfer from another cultivar of the same species with a size correction and an assumed black-bean diameter, not a kidney-bean curve; the rate prior is not fitted to experiments of this bed, and the drying times were not validated as real predictions.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete slow and fast records follow the common nominal-multiplier kinetics
      stress design equation.
    verification: mathematically_reproduced
