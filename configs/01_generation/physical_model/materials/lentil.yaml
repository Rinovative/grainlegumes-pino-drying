# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Material-specific physical design in edit order: sampled values, density, Oswin, target, kinetics. Nominals/supports are parameterization choices, not universal constants.
schema_kind: generation_material
material_family: lentil
material_scope:
  common_name: Lentil
  species: Lens culinaris Medik.
  market_class: red_or_brown_dry_lentil
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature dry red or brown lentil seed
# The permeability scale kappa_mean is in m^2. Natural support and transform define sampling; ood_supports are separate synthetic stress intervals.
permeability:
  nominal: 4.0e-09
  support:
    lower: 2.5e-09
    upper: 8.0e-09
  transform: log
  distribution: uniform_in_log_space
  ood_supports:
  - lower: 9.14e-10
    upper: 1.78e-09
  - lower: 1.02e-08
    upper: 1.93e-08
  provenance:
    evidence: project_baseline
    source_refs:
    - ba
    - cgc_airflow_resistance_charts
    method: Project-measured permeability without the K_A correction (4.11e-09 m^2) together with the Canadian Grain Commission airflow-resistance charts (apparent permeability 5.2, 4.0, 3.1 and 2.6e-09 m^2 at 0.05, 0.1, 0.2 and 0.3 m/s); the K_A-corrected value 7.88e-09 m^2 is not used. The value is an apparent permeability near the operating point.
    applicability:
      packing: Only for packing bands in each complete density record; generated mean
        eps must pass the material band.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Explicit synthetic stress intervals admitted by the registry-wide transformed
      gap and width policy; permeability tails also satisfy fixed Kozeny-Carman guards.
    verification: mathematically_reproduced
# Granular-phase thermal values: k_gr is conductivity and cp_gr_dry is dry-solid specific heat. Natural and OOD supports are design ranges.
thermal_properties:
  k_gr:
    nominal: 0.364
    support:
      lower: 0.3
      upper: 0.44
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 0.2
      upper: 0.26
    - lower: 0.52
      upper: 0.65
    provenance:
      evidence: literature_fit
      source_refs:
      - matouk_thermal
      - lentil_thermal_gharibzahedi_2014
      - pulse_thermal_oke_baik_2022
      method: Value from Matouk et al. (2018). Gharibzahedi et al. (2014) and Oke and Baik (2022) measure packed beds; converted to grain conductivity with the Maxwell-Eucken relation they give 0.30-0.38 and 0.25-0.30 W/(m*K) against the value 0.364, so they only check it and the value is unchanged.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  cp_gr_dry:
    nominal: 2100.0
    support:
      lower: 1800.0
      upper: 2300.0
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 1300.0
      upper: 1600.0
    - lower: 2600.0
      upper: 3000.0
    provenance:
      evidence: literature_fit
      source_refs:
      - matouk_thermal
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
# Initial moisture is dry basis (kg water/kg dry solids); amplitude controls field variation and field_support bounds generated values.
initial_moisture:
  mean_db:
    nominal: 0.2345679012345679
    support:
      lower: 0.1904761904761905
      upper: 0.28205128205128205
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.3
      upper: 0.35
    provenance:
      evidence: engineering_estimate
      source_refs:
      - ba
      note: Natural material-dependent starting moisture in dry basis; range is an
        explicit engineering envelope around project or product-compatible drying
        evidence, not a market-target transfer.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  amplitude_db:
    nominal: 0.02
    support:
      lower: 0.005
      upper: 0.04
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.055
      upper: 0.08
    provenance:
      evidence: synthetic_design
      source_refs:
      - pino_airflow_project
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  field_support:
    lower: 0.16606936416184973
    upper: 0.32205128205128203
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - ba
      method: X_db=X_wb/(1-X_wb); lower bound is the target 0.135/0.865 plus margin_above_target_db 0.01, upper bound is the upper mean_db 0.22/0.78 plus the upper amplitude_db 0.04.
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
# Dimensionless support for generated bed-mean porosity; density calibration stores a compatible paired reference state.
packing_porosity_mean_support:
  lower: 0.29
  upper: 0.36
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - ba
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Project real mixed-lentil bed; dry bulk density reconstructed consistently
        from particle density, porosity and 20% wb moisture.
# Dry bulk-density calibration and paired bed porosity define the material reference used for packing/density consistency. OOD records are complete alternatives selected atomically.
density_calibration:
  record_id: lentil_density_calibration_v1
  reference:
    rho_bu_dry_ref: 630.0
    eps_bed_ref: 0.3125
  rho_bu_dry_ref_support:
    lower: 590.0
    upper: 680.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 475.0
    eps_bed_ref: 0.48164683
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  - record_id: dense_high_density
    rho_bu_dry_ref: 720.0
    eps_bed_ref: 0.21428571
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - ba
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Project real mixed-lentil bed; dry bulk density reconstructed consistently
        from particle density, porosity and 20% wb moisture.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete loose and dense packing records derived at the fixed reference
      inferred dry particle density.
    verification: mathematically_reproduced
# Coupled Oswin equilibrium-isotherm coefficients; preserve each material record and its stated units/evidence as one parameter set.
oswin:
  record_id: lentil_production_oswin_v1
  components:
    A_osw: 12.06202053
    B_osw: -0.0573838
    C_osw: 0.34338283
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or
    per degree Celsius increment
  provenance:
    evidence: literature_fit
    source_refs:
    - lentil_oswin_source
    method: 'Re-fit of 4637 reconstructed source-surface points: RMSE 0.6542 percentage
      points db, MRE 3.867%, R2 0.96619. These statistics were calculated here, not
      reported by the source.'
    applicability:
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted
        by 0.01
      evidence_scope: 5-30 degC, RH 0.27-0.90, approximately 8-22% db; pooled equal-weight
        source-model surfaces of three whole red-lentil cultivars
# Single operational drying target on a wet basis; it is a material target, not an initial-moisture support.
target_moisture:
  target_moisture_wb: 0.135
  provenance:
    evidence: literature_transfer
    source_refs:
    - swiss_crops
    method: Transferred from swiss granum (2026-03-12) chapter 1.1, which lists 13.5 % wb for chickpeas and protein peas; chapter 1.1 has no entry for lentils.
    note: Single practical safe-storage drying target; market acceptance is not
      an operational target.
# Surface/internal moisture-transfer prior: r_surf_0 is a rate, r_int_surf a rate ratio, f_surf a fraction; the loader derives the two OOD records from the nominals.
two_compartment_kinetics:
  record_id: lentil_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 1.1e-04
      support:
        lower: 6.05e-05
        upper: 1.76e-04
      transform: log
    r_int_surf:
      nominal: 0.2
      support:
        lower: 0.12
        upper: 0.35
      transform: log
    f_surf:
      nominal: 0.5
      support:
        lower: 0.3
        upper: 0.65
      transform: logit
  selection_rule: complete_record_atomic
  provenance:
    evidence: calibration_prior
    source_refs:
    - lentil_drying
    - lentil_drying_tahmasebi_2025
    method: r_surf_0 and its support are the earlier design values multiplied by 5.5, so that the thin-layer drying time of lentil from 20.7 to 12 % wb at 35 degC and 20 % relative humidity is about 10 h (about 14 h at 40 % relative humidity). The anchor is Tahmasebi et al. (2025, Table 2) with 20.67 to about 12 % wb in 380 min at 50 degC and 1 m/s, converted to 35 degC with an assumed activation energy of 21-32 kJ/mol (9-12 h); r_int_surf and f_surf are unchanged.
    applicability:
      evidence_scope: independent whole-particle X_db(t) or moisture-ratio curves
        at known T, RH/omega, airflow and product state; T(t) if available
      limitation: The rate prior is calibrated to one literature drying time, not fitted to experiments of this bed; the activation energy of the temperature conversion is assumed, and the drying times were not validated as real predictions.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete slow and fast records follow the common nominal-multiplier kinetics
      stress design equation.
    verification: mathematically_reproduced
