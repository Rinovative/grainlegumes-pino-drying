# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Material-specific physical design in edit order: sampled values, density, Oswin, target, kinetics. Nominals/supports are parameterization choices, not universal constants.
schema_kind: generation_material
material_family: chickpea
material_scope:
  common_name: Chickpea
  species: Cicer arietinum L.
  market_class: kabuli
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature dry Kabuli chickpea
# The permeability scale kappa_mean is in m^2. Natural support and transform define sampling; ood_supports are separate synthetic stress intervals.
permeability:
  nominal: 3.0e-08
  support:
    lower: 1.4e-08
    upper: 6.0e-08
  transform: log
  distribution: uniform_in_log_space
  ood_supports:
  - lower: 5.24e-09
    upper: 1.05e-08
  - lower: 1.01e-07
    upper: 1.68e-07
  provenance:
    evidence: literature_transfer
    source_refs:
    - chickpea_airflow_masoumi_tabil_2008
    method: Clean chickpea like the density and porosity record. Masoumi and Tabil (2008, Table 2) give 2.4-6.2e-08 m^2 at 0.14 m/s, and the Kozeny-Carman estimate at the reference porosity 0.403 is 3.1e-08 m^2; the farm-bed value 1.43e-08 m^2 of the thesis, measured with fines, is not used.
    applicability:
      packing: Only for packing bands in each complete density record; generated mean
        eps must pass the material band.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Explicit synthetic stress intervals admitted by the registry-wide transformed
      gap and width policy; permeability tails also satisfy fixed Kozeny-Carman guards.
    verification: mathematically_reproduced
# Granular-phase thermal values: k_gr is conductivity and cp_gr_dry is dry-solid specific heat. Natural and OOD supports are design ranges.
thermal_properties:
  k_gr:
    nominal: 0.3
    support:
      lower: 0.24
      upper: 0.38
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 0.16
      upper: 0.2
    - lower: 0.46
      upper: 0.58
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
      - lentil_thermal_gharibzahedi_2014
      - pulse_thermal_oke_baik_2022
      method: Transferred from lentil and faba bean, the only grains Matouk et al. (2018) cover. Oke and Baik (2022) chickpea packed-bed values converted with the Maxwell-Eucken relation give 0.29-0.42 W/(m*K) against 0.30, and Gharibzahedi et al. (2014) check the lentil value used for the transfer; the value is unchanged.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  cp_gr_dry:
    nominal: 1900.0
    support:
      lower: 1600.0
      upper: 2200.0
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 1200.0
      upper: 1450.0
    - lower: 2500.0
      upper: 2900.0
    provenance:
      evidence: literature_transfer
      source_refs:
      - matouk_thermal
      method: Transferred from lentil and faba bean, the only grains Matouk et al. (2018) cover; the value is unchanged.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
# Initial moisture is dry basis (kg water/kg dry solids); amplitude controls field variation and field_support bounds generated values.
initial_moisture:
  mean_db:
    nominal: 0.2345679012345679
    support:
      lower: 0.1904761904761905
      upper: 0.28205128205128205
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.3
      upper: 0.35
    provenance:
      evidence: engineering_estimate
      source_refs:
      - ba
      note: Natural material-dependent starting moisture in dry basis; range is an
        explicit engineering envelope around project or product-compatible drying
        evidence, not a market-target transfer.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  amplitude_db:
    nominal: 0.02
    support:
      lower: 0.005
      upper: 0.04
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.055
      upper: 0.08
    provenance:
      evidence: synthetic_design
      source_refs:
      - pino_airflow_project
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  field_support:
    lower: 0.16606936416184973
    upper: 0.32205128205128203
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - ba
      method: X_db=X_wb/(1-X_wb); lower bound is the target 0.135/0.865 plus margin_above_target_db 0.01, upper bound is the upper mean_db 0.22/0.78 plus the upper amplitude_db 0.04.
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
# Dimensionless support for generated bed-mean porosity; density calibration stores a compatible paired reference state.
packing_porosity_mean_support:
  lower: 0.37
  upper: 0.45
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - chickpea_physical
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole black-Kabuli density/porosity relation evaluated near 13% db;
        range widened for Kabuli cultivar and packing transfer.
# Dry bulk-density calibration and paired bed porosity define the material reference used for packing/density consistency. OOD records are complete alternatives selected atomically.
density_calibration:
  record_id: chickpea_density_calibration_v1
  reference:
    rho_bu_dry_ref: 676.0
    eps_bed_ref: 0.403
  rho_bu_dry_ref_support:
    lower: 620.0
    upper: 730.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 505.0
    eps_bed_ref: 0.55401627
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  - record_id: dense_high_density
    rho_bu_dry_ref: 855.0
    eps_bed_ref: 0.24491864
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - chickpea_physical
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole black-Kabuli density/porosity relation evaluated near 13% db;
        range widened for Kabuli cultivar and packing transfer.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete loose and dense packing records derived at the fixed reference
      inferred dry particle density.
    verification: mathematically_reproduced
# Coupled Oswin equilibrium-isotherm coefficients; preserve each material record and its stated units/evidence as one parameter set.
oswin:
  record_id: chickpea_production_oswin_v1
  components:
    A_osw: 11.21749504
    B_osw: -0.06156313
    C_osw: 0.49141999
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or
    per degree Celsius increment
  provenance:
    evidence: literature_fit
    source_refs:
    - chickpea_oswin_source
    method: 'Re-fit of 2402 reconstructed modified-Henderson source-surface points:
      RMSE 0.10895 percentage points db, MRE 0.7516%, R2 0.99771. Statistics calculated
      here.'
    applicability:
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted
        by 0.01
      evidence_scope: 15-35 degC, source desorption 8.9-16.9% db; fit evaluated over
        RH 0.30-0.80
# Single operational drying target on a wet basis; it is a material target, not an initial-moisture support.
target_moisture:
  target_moisture_wb: 0.135
  provenance:
    evidence: official_industry_target
    source_refs:
    - swiss_crops
    method: swiss granum (2026-03-12) chapter 1.1 lists 13.5 % wb for chickpeas.
    note: Single practical safe-storage drying target; market acceptance is not
      an operational target.
# Surface/internal moisture-transfer prior: r_surf_0 is a rate, r_int_surf a rate ratio, f_surf a fraction; the loader derives the two OOD records from the nominals.
two_compartment_kinetics:
  record_id: chickpea_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 5.5e-05
      support:
        lower: 2.75e-05
        upper: 9.9e-05
      transform: log
    r_int_surf:
      nominal: 0.15
      support:
        lower: 0.10
        upper: 0.3
      transform: log
    f_surf:
      nominal: 0.45
      support:
        lower: 0.28
        upper: 0.62
      transform: logit
  selection_rule: complete_record_atomic
  provenance:
    evidence: calibration_prior
    source_refs:
    - chickpea_drying
    - lentil_drying_tahmasebi_2025
    method: r_surf_0 and its support are the earlier design values multiplied by 5.5, the factor of lentil (Tahmasebi et al. 2025, calibrated at 35 degC and 20 % relative humidity), as a fallback until a comparable literature end point exists. Cavalcanti-Mata et al. (2020) report about 20 h at 40 degC but only the abstract was read and the end moisture is unknown, so chickpea_drying serves only as a plausibility check; r_int_surf and f_surf are unchanged.
    applicability:
      evidence_scope: independent whole-particle X_db(t) or moisture-ratio curves
        at known T, RH/omega, airflow and product state; T(t) if available
      limitation: The rate prior is the lentil factor used as a fallback pending a comparable chickpea drying end point; it is not fitted to experiments of this bed, and the drying times were not validated as real predictions.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete slow and fast records follow the common nominal-multiplier kinetics
      stress design equation.
    verification: mathematically_reproduced
