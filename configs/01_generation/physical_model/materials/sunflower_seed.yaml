# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Material-specific physical design in edit order: sampled values, density, Oswin, target, kinetics. Nominals/supports are parameterization choices, not universal constants.
schema_kind: generation_material
material_family: sunflower_seed
material_scope:
  common_name: Sunflower seed
  species: Helianthus annuus L.
  market_class: high_oleic_oil_type
  product_form: whole_achene
  coat_or_hull_state: hull_intact
  description: Cleaned whole mature high-oleic sunflower achene
# The permeability scale kappa_mean is in m^2. Natural support and transform define sampling; ood_supports are separate synthetic stress intervals.
permeability:
  nominal: 8.0e-09
  support:
    lower: 4.0e-09
    upper: 1.6e-08
  transform: log
  distribution: uniform_in_log_space
  ood_supports:
  - lower: 1.2e-09
    upper: 2.6e-09
  - lower: 2.4e-08
    upper: 4.125e-08
  provenance:
    evidence: engineering_estimate
    source_refs:
    - airflow_friesen_huminicki_1986
    method: Field measurements of Friesen and Huminicki (1986, Table II) give 6.7, 5.5 and 4.0e-09 m^2 at 0.05, 0.1 and 0.3 m/s; the lower bound is the field value, the upper bound the laboratory estimate of about five times the field value (1.6e-08 m^2, not rechecked), and the nominal value is their geometric mean. The earlier conversion from the Agriculture Canada handbook could not be reproduced and is not cited.
    applicability:
      packing: Only for packing bands in each complete density record; generated mean
        eps must pass the material band.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Explicit synthetic stress intervals admitted by the registry-wide transformed
      gap and width policy; permeability tails also satisfy fixed Kozeny-Carman guards.
    verification: mathematically_reproduced
# Granular-phase thermal values: k_gr is conductivity and cp_gr_dry is dry-solid specific heat. Natural and OOD supports are design ranges.
thermal_properties:
  k_gr:
    nominal: 0.2
    support:
      lower: 0.16
      upper: 0.3
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 0.1
      upper: 0.13
    - lower: 0.38
      upper: 0.5
    provenance:
      evidence: engineering_inversion
      source_refs:
      - sunflower_thermal_ince_2008
      method: Dry granular-phase conductivity selected by inverting the binding Maxwell-Eucken
        relation so the packed effective conductivity matches the low-moisture sunflower
        measurements near VP2 temperatures.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  cp_gr_dry:
    nominal: 1650.0
    support:
      lower: 1400.0
      upper: 1900.0
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 1000.0
      upper: 1250.0
    - lower: 2100.0
      upper: 2500.0
    provenance:
      evidence: engineering_estimate
      source_refs:
      - sunflower_thermal_ince_2008
      method: Realistic dry-solid specific heat of sunflower seed is 1400-1900 J/(kg*K) from a composition-based estimate that was not independently verified. Ince et al. (2008) report 865-1930 J/(kg*K) for the wet product, about 1300-1500 on a dry basis; the earlier value of 700 J/(kg*K) is physically impossible.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
# Initial moisture is dry basis (kg water/kg dry solids); amplitude controls field variation and field_support bounds generated values.
initial_moisture:
  mean_db:
    nominal: 0.14942528735632185
    support:
      lower: 0.0989010989010989
      upper: 0.2195121951219512
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.27
      upper: 0.36
    provenance:
      evidence: engineering_estimate
      source_refs:
      - sunflower_sorption_drying_munder_2019
      note: Natural whole-seed starting-moisture envelope chosen inside the product-compatible
        sorption/drying domain and above the 6% wb target; no measurement of the future
        lot is claimed.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  amplitude_db:
    nominal: 0.015
    support:
      lower: 0.003
      upper: 0.03
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.042
      upper: 0.06
    provenance:
      evidence: synthetic_design
      source_refs:
      - sunflower_sorption_drying_munder_2019
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  field_support:
    lower: 0.0989010989010989
    upper: 0.2195121951219512
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - sunflower_sorption_drying_munder_2019
      method: X_db=X_wb/(1-X_wb)
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
# Dimensionless support for generated bed-mean porosity; density calibration stores a compatible paired reference state.
packing_porosity_mean_support:
  lower: 0.5
  upper: 0.57
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - sunflower_density_isik_izli_2007
    method: Select the complete rho-eps pair atomically. Never combine density and
      porosity from different source states.
    verification: mathematically_reproduced
    applicability:
      packing: Isik and Izli whole-seed record at 10.06% db; measured bulk mass density
        divided by 1+X_db while porosity remains unchanged under the paired bulk/true-density
        conversion.
# Dry bulk-density calibration and paired bed porosity define the material reference used for packing/density consistency. OOD records are complete alternatives selected atomically.
density_calibration:
  record_id: sunflower_seed_density_calibration_v1
  reference:
    rho_bu_dry_ref: 377.4
    eps_bed_ref: 0.5306
  rho_bu_dry_ref_support:
    lower: 330.0
    upper: 410.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 270
    eps_bed_ref: 0.66418124
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  - record_id: dense_high_density
    rho_bu_dry_ref: 610
    eps_bed_ref: 0.24129836
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - sunflower_density_isik_izli_2007
    method: Select the complete rho-eps pair atomically. Never combine density and
      porosity from different source states.
    verification: mathematically_reproduced
    applicability:
      packing: Isik and Izli whole-seed record at 10.06% db; measured bulk mass density
        divided by 1+X_db while porosity remains unchanged under the paired bulk/true-density
        conversion.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete loose and dense packing records derived at the fixed reference
      inferred dry particle density.
    verification: mathematically_reproduced
# Coupled Oswin equilibrium-isotherm coefficients; preserve each material record and its stated units/evidence as one parameter set.
oswin:
  record_id: sunflower_seed_production_oswin_v1
  components:
    A_osw: 4.8
    B_osw: -0.0158
    C_osw: 0.622278
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical B is per kelvin or per degree
    Celsius increment
  provenance:
    evidence: literature_convention_conversion
    source_refs:
    - sunflower_sorption_drying_munder_2019
    method: Exact equation-convention conversion into the binding A/B/C form; no new
      fit and no coefficient mixing are claimed.
    applicability:
      moisture_basis: kg water/kg dry solids; source kg/kg dry-matter coefficient
        scale converted to the binding percent-db prefactor
      evidence_scope: Whole high-oleic hull-intact sunflower seed; 25-50 degC and
        aw 0.10-0.95.
# Single operational drying target on a wet basis; it is a material target, not an initial-moisture support.
target_moisture:
  target_moisture_wb: 0.06
  provenance:
    evidence: official_industry_target
    source_refs:
    - swiss_oil
    method: The source-backed safe-storage target is already the practical whole
      wet-basis percentage value 0.06 wb.
    note: Single practical safe-storage drying target; market acceptance is not
      a separate operational target.
# Surface/internal moisture-transfer prior: r_surf_0 is a rate, r_int_surf a rate ratio, f_surf a fraction; the loader derives the two OOD records from the nominals.
two_compartment_kinetics:
  record_id: sunflower_seed_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 5.5e-05
      support:
        lower: 2.75e-05
        upper: 9.9e-05
      transform: log
    r_int_surf:
      nominal: 0.15
      support:
        lower: 0.10
        upper: 0.3
      transform: log
    f_surf:
      nominal: 0.45
      support:
        lower: 0.25
        upper: 0.65
      transform: logit
  selection_rule: complete_record_atomic
  provenance:
    evidence: hierarchical_engineering_prior
    source_refs:
    - sunflower_sorption_drying_munder_2019
    - lentil_drying_tahmasebi_2025
    method: r_surf_0 and its support are the earlier design values multiplied by 5.5, the factor of lentil (Tahmasebi et al. 2025, calibrated at 35 degC and 20 % relative humidity), transferred as a placeholder because Munder et al. (2019) could not be read and no sunflower literature drying time is known; r_int_surf and f_surf are unchanged.
    applicability:
      evidence_scope: A desired nominal drying duration, or preferably independent
        whole-seed X_db(t) curves at known T, RH/omega and airflow.
      limitation: The rate prior is transferred from lentil, not fitted to experiments, and the drying times were not validated as real predictions; sunflower remains an engineering stress-test material.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete slow and fast records follow the common nominal-multiplier kinetics
      stress design equation.
    verification: mathematically_reproduced
