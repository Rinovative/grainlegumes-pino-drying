# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Material-specific physical design in edit order: sampled values, density, Oswin, target, kinetics. Nominals/supports are parameterization choices, not universal constants.
schema_kind: generation_material
material_family: rapeseed
material_scope:
  common_name: Rapeseed / canola
  species: Brassica napus L.
  market_class: canola_quality_rapeseed
  product_form: whole_seed
  coat_or_hull_state: intact
  description: Whole mature uncrushed rapeseed or canola seed
# The permeability scale kappa_mean is in m^2. Natural support and transform define sampling; ood_supports are separate synthetic stress intervals.
permeability:
  nominal: 2.0e-09
  support:
    lower: 1.2e-09
    upper: 3.5e-09
  transform: log
  distribution: uniform_in_log_space
  ood_supports:
  - lower: 3.0e-10
    upper: 6.5e-10
  - lower: 7.2e-09
    upper: 1.2375e-08
  provenance:
    evidence: engineering_estimate
    source_refs:
    - cgc_airflow_resistance_charts
    - airflow_friesen_huminicki_1986
    method: Canadian Grain Commission airflow-resistance charts give apparent permeabilities of 2.0, 1.8, 1.6 and 1.55e-09 m^2 for rising air velocity, and Friesen and Huminicki (1986) give 2.3e-09 m^2 at 0.05-0.1 m/s. The earlier value 4.0e-09 m^2 was a Kozeny-Carman estimate with a grain diameter of 2 mm and no airflow data; Jayas et al. (1987) are not used for any value.
    applicability:
      packing: Only for packing bands in each complete density record; generated mean
        eps must pass the material band.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Explicit synthetic stress intervals admitted by the registry-wide transformed
      gap and width policy; permeability tails also satisfy fixed Kozeny-Carman guards.
    verification: mathematically_reproduced
# Granular-phase thermal values: k_gr is conductivity and cp_gr_dry is dry-solid specific heat. Natural and OOD supports are design ranges.
thermal_properties:
  k_gr:
    nominal: 0.2
    support:
      lower: 0.15
      upper: 0.25
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 0.09
      upper: 0.12
    - lower: 0.31
      upper: 0.4
    provenance:
      evidence: literature_direct
      source_refs:
      - canola_thermal
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  cp_gr_dry:
    nominal: 1850.0
    support:
      lower: 1600.0
      upper: 2100.0
    transform: log
    distribution: uniform_in_log_space
    ood_supports:
    - lower: 1200
      upper: 1450
    - lower: 2400
      upper: 2800
    provenance:
      evidence: literature_direct
      source_refs:
      - canola_thermal
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
# Initial moisture is dry basis (kg water/kg dry solids); amplitude controls field variation and field_support bounds generated values.
initial_moisture:
  mean_db:
    nominal: 0.12359550561797752
    support:
      lower: 0.08695652173913043
      upper: 0.16279069767441862
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.18
      upper: 0.22
    provenance:
      evidence: engineering_estimate
      source_refs:
      - canola_drying
      note: Natural material-dependent starting moisture in dry basis; range is an
        explicit engineering envelope around project or product-compatible drying
        evidence, not a market-target transfer.
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  amplitude_db:
    nominal: 0.012
    support:
      lower: 0.003
      upper: 0.025
    transform: linear
    distribution: uniform
    ood_supports:
    - lower: 0.035
      upper: 0.05
    provenance:
      evidence: synthetic_design
      source_refs:
      - pino_airflow_project
    ood_provenance:
      evidence: synthetic_design
      source_refs: []
      method: Explicit synthetic stress intervals admitted by the registry-wide transformed
        gap and width policy.
      verification: mathematically_reproduced
  field_support:
    lower: 0.07382978723404254
    upper: 0.1877906976744186
    unit: kg/kg
    provenance:
      evidence: derived
      source_refs:
      - canola_drying
      method: X_db=X_wb/(1-X_wb); lower bound is the target 0.06/0.94 plus margin_above_target_db 0.01, upper bound is the upper mean_db 0.14/0.86 plus the upper amplitude_db 0.025.
      verification: mathematically_reproduced
  margin_above_target_db: 0.01
# Dimensionless support for generated bed-mean porosity; density calibration stores a compatible paired reference state.
packing_porosity_mean_support:
  lower: 0.365
  upper: 0.422
  unit: '1'
  provenance:
    evidence: coupled_record
    source_refs:
    - canola_thermal
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole-seed bulk and particle density ranges from one compatible study;
        reference pair selected near 6-11% wb.
# Dry bulk-density calibration and paired bed porosity define the material reference used for packing/density consistency. OOD records are complete alternatives selected atomically.
density_calibration:
  record_id: rapeseed_density_calibration_v1
  reference:
    rho_bu_dry_ref: 620.0
    eps_bed_ref: 0.4
  rho_bu_dry_ref_support:
    lower: 590.0
    upper: 640.0
    transform: log
  ood_records:
  - record_id: loose_low_density
    rho_bu_dry_ref: 500
    eps_bed_ref: 0.51612903
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  - record_id: dense_high_density
    rho_bu_dry_ref: 800
    eps_bed_ref: 0.22580645
    basis: same inferred dry particle density as reference; alternate complete packing
      record
  selection_rule: complete_record_atomic
  provenance:
    evidence: coupled_record
    source_refs:
    - canola_thermal
    method: Select a complete record atomically. Never combine rho from one source/record
      with eps from another.
    verification: mathematically_reproduced
    applicability:
      packing: Whole-seed bulk and particle density ranges from one compatible study;
        reference pair selected near 6-11% wb.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete loose and dense packing records derived at the fixed reference
      inferred dry particle density.
    verification: mathematically_reproduced
# Coupled Oswin equilibrium-isotherm coefficients; preserve each material record and its stated units/evidence as one parameter set.
oswin:
  record_id: rapeseed_production_oswin_v1
  components:
    A_osw: 6.954722
    B_osw: -0.032779
    C_osw: 0.47020742
  units:
    A_osw: '1'
    B_osw: 1/K
    C_osw: '1'
  equation: X_eq_db=0.01*(A_osw+B_osw*(T-273.15[K]))*(phi_eff/(1-phi_eff))^C_osw
  temperature_variable: T_C=T_K-273.15 K; numerical coefficient B is per kelvin or
    per degree Celsius increment
  provenance:
    evidence: literature_direct
    source_refs:
    - canola_oswin
    applicability:
      moisture_basis: kg water/kg dry solids; source percent-db prefactor converted
        by 0.01
      evidence_scope: Whole intact Option 500 canola, desorption, 30-60 degC, aw 0.11-0.81,
        % db
# Single operational drying target on a wet basis; it is a material target, not an initial-moisture support.
target_moisture:
  target_moisture_wb: 0.06
  provenance:
    evidence: official_industry_target
    source_refs:
    - swiss_oil
    method: swiss granum oilseeds (2026-03-19) chapter 1.7.1 limits rapeseed to at most 6 % wb, so the practical target is 0.06 wb.
    note: Single practical safe-storage drying target; market acceptance is not
      a separate operational target.
# Surface/internal moisture-transfer prior: r_surf_0 is a rate, r_int_surf a rate ratio, f_surf a fraction; the loader derives the two OOD records from the nominals.
two_compartment_kinetics:
  record_id: rapeseed_two_compartment_kinetics_v1
  components:
    r_surf_0:
      nominal: 2.0e-04
      support:
        lower: 1.1e-04
        upper: 3.3e-04
      transform: log
    r_int_surf:
      nominal: 0.22
      support:
        lower: 0.12
        upper: 0.4
      transform: log
    f_surf:
      nominal: 0.5
      support:
        lower: 0.3
        upper: 0.68
      transform: logit
  selection_rule: complete_record_atomic
  provenance:
    evidence: calibration_prior
    source_refs:
    - canola_drying
    method: r_surf_0 and its support are the earlier design values multiplied by 10, so that the thin-layer drying time of rapeseed from 12 to 6 % wb is about 7.8 h at 40 degC, the literature time of Costa et al. (2020, Eq. 12); r_int_surf and f_surf are unchanged.
    applicability:
      evidence_scope: independent whole-particle X_db(t) or moisture-ratio curves
        at known T, RH/omega, airflow and product state; T(t) if available
      limitation: The rate prior is calibrated to one literature drying time, not fitted to experiments of this bed, and the drying times were not validated as real predictions.
  ood_provenance:
    evidence: synthetic_design
    source_refs: []
    method: Complete slow and fast records follow the common nominal-multiplier kinetics
      stress design equation.
    verification: mathematically_reproduced
