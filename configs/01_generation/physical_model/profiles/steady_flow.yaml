# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Profile contract connecting a COMSOL template to typed exported fields; the shared stationary-airflow conditioning is owned by the loader.
schema_kind: generation_profile
simulation_profile: steady_flow
template: simulation/steady_flow/steady_flow_template.mph
# Artifact roles, source filenames, temporal meaning, and column mapping emitted by this profile.
exports:
- role: steady_flow_fields
  temporal_kind: stationary
  source: stationary_fields.csv
  delimiter: ','
  columns:
    x: x
    y: y
    Kxx: Kxx
    Kxy: Kxy
    Kyy: Kyy
    eps_bed: eps_bed
    p_in_bc: p_in_bc
    u: u
    v: v
    p: p
