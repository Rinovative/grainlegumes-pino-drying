# Role: reference data of the physical model. Edit: only with new physical evidence or a deliberate model change.
# Operation and inlet-schedule distributions (registry block operation); bed and field statistics are in bed_fields.yaml, the fixed schedule rules in the loader.
schema_kind: generation_operations
# Named operation coordinates with natural and optional parameter-OOD supports. Nominals and supports use each registry transform (registry.yaml).
parameter_values:
  # Base inlet temperature; T_in_amp adds the scheduled variation.
  T_in_base:
    lower: 303.15
    upper: 309.15
    ood:
    - lower: 298.15
      upper: 300.15
    - lower: 311.15
      upper: 313.15
    nominal: 308.15
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: project_baseline
      source_refs:
      - ba
  T_in_amp:
    lower: 0.0
    upper: 8.0
    ood:
    - lower: 9.25
      upper: 10.0
      hard_boundary: true
    nominal: 2.5
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: synthetic_design
      source_refs:
      - ba
      note: Exact symmetric maximum deviation widened to create a random lower-temperature tail; complete infeasible schedules are rejected without clipping.
  # Base inlet humidity ratio; omega_in_amp adds the scheduled variation.
  omega_in_base:
    lower: 0.0045
    upper: 0.0115
    ood:
    - lower: 0.0025
      upper: 0.0034
      hard_boundary: true
    - lower: 0.013
      upper: 0.0145
      hard_boundary: true
    nominal: 0.0075
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: engineering_estimate
      source_refs:
      - transient_comsol_model_report
  omega_in_amp:
    lower: 0.0
    upper: 0.003
    ood:
    - lower: 0.004
      upper: 0.0055
    nominal: 0.0015
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: synthetic_design
      source_refs:
      - transient_comsol_model_report
  # Correlation between generated inlet-temperature and humidity-ratio schedule components.
  schedule.corr:
    lower: -0.75
    upper: 0.25
    ood:
    - lower: 0.55
      upper: 0.85
    nominal: -0.35
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: synthetic_design
      source_refs:
      - vm2_project
  schedule.timescale_rel:
    lower: 0.05
    upper: 0.18
    ood:
    - lower: 0.024
      upper: 0.036
    - lower: 0.25
      upper: 0.4
    nominal: 0.08
    distribution: uniform_in_log_transform_space
    provenance:
      evidence: synthetic_design
      source_refs:
      - vm2_project
  # Truncated simplex weights for smooth, event, and trend schedule components.
  schedule.component_weights:
    selection: truncated_dirichlet
    alpha:
    - 5.5
    - 3.0
    - 1.5
    minimum_each: 0.05
    maximum_each: 0.8
    nominal:
      smooth: 0.55
      event: 0.3
      trend: 0.15
    distribution: Dirichlet_with_truncation_and_full_simplex_selection
    provenance:
      evidence: synthetic_design
      source_refs:
      - vm2_project
    record_id: schedule_component_simplex_v1
  # Discrete count of schedule events; duration and width control their relative scales.
  schedule.event_count:
    lower: 0
    upper: 4
    ood:
    - lower: 6.0
      upper: 9.0
    nominal: 2
    distribution: discrete_uniform_inclusive
    provenance:
      evidence: synthetic_design
      source_refs:
      - vm2_project
  schedule.event_duration_rel:
    lower: 0.08
    upper: 0.16
    ood:
    - lower: 0.04
      upper: 0.06
    - lower: 0.22
      upper: 0.32
    nominal: 0.1
    distribution: uniform_in_log_transform_space
    provenance:
      evidence: synthetic_design
      source_refs:
      - vm2_project
  schedule.event_width_rel:
    lower: 0.02
    upper: 0.04
    ood:
    - lower: 0.012
      upper: 0.016
    - lower: 0.06
      upper: 0.09
    nominal: 0.03
    distribution: uniform_in_log_transform_space
    provenance:
      evidence: synthetic_design
      source_refs:
      - vm2_project
  # Ambient temperature used by the operation and initial-state contract.
  T_amb:
    lower: 288.15
    upper: 298.15
    ood:
    - lower: 281.15
      upper: 285.15
    - lower: 300.15
      upper: 303.15
    nominal: 293.15
    distribution: uniform_in_registry_transform_space
    provenance:
      evidence: project_baseline
      source_refs:
      - ba
# Startup handoff controls for transient inlet conditions; duration is physical hours, the RH margin is dimensionless, and the ceiling is relative humidity.
boundary_schedule:
  startup_ramp:
    enabled: true
    duration_h: 0.5
    initial_equilibrium_rh_dry_margin: 0.05
    max_relative_humidity: 0.90
