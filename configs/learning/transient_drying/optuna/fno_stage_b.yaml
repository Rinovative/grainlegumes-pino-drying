study:
  name: transient_drying_fno_stage_b_search
  role: production
  seed: 9
  n_trials: 30
  sampler:
    kind: tpe
    multivariate: true
  pruner:
    kind: median
    n_startup_trials: 5
    n_warmup_steps: 5
    interval_steps: 1

experiment:
  task: transient_drying
  run:
    seed: 9
    deterministic: true
    device: cuda
    suffix: optuna_stage_b
  data:
    train_dataset: transient_drying__material_pilot__id
    ood_datasets:
    - transient_drying__family_generalization__ood
    batch_size: 2
    transient_backend_preference: pt_shards
    transient_backend_required: false
    hdf5_cache_size: 0
    allow_technical_smoke: false
  input_profile: canonical_physics_complete_v1
  temporal:
    sampling:
      mode: rollout_window
      rollout_length: 32
      window_stride: 32
      window_offset: 0
    temporal_conditioning:
      kind: none
  scaling:
    mode: state_std
  loss:
    data:
      kind: huber
      space: scaled_increment
      weight: 1.0
      beta: 1.0
      channel_weights:
      - 1.0
      - 1.0
      - 1.0
      - 1.0
      state_aux_weight: 0.0
    physics:
      enabled: false
      continuity: none
  evaluation:
    objective:
      id: normalized_drying_group_macro_rmse
  optimizer:
    kind: adamw
    lr: 0.0003883614530748613
    weight_decay: 0.0001
  scheduler:
    kind: reduce_on_plateau
    factor: 0.5
    patience: 10
    min_lr: 1.0e-06
  training:
    epochs: 100
    evaluation_interval: 1
    ood_evaluation_interval: 1
    mixed_precision: false
    stage: b
    comparison_arm: b
    gradient_accumulation_steps: 1
    fixed_evaluation_horizon: 32
    curriculum:
      lengths:
      - 2
      - 4
      - 8
      - 16
      - 32
      milestone_fractions:
      - 0.0
      - 0.2
      - 0.4
      - 0.6
      - 0.8
      seed: 9
    matched_compute:
      planned_seconds: 3600.0
      planned_steps: null
      rollout_reference_seconds: null
      rollout_reference_steps: null
    teacher_handoff:
      source_run_name: fno_a0_teacher
  tracking:
    wandb:
      mode: offline
      workflow: optuna_trial
      monitor:
        enabled: false
        interval: 1
        max_cases: 1
  model:
    kind: fno
    params:
      n_modes:
      - 128
      - 160
      hidden_channels: 64
      n_layers: 3
      lifting_channel_ratio: 2
      projection_channel_ratio: 2
      fno_skip: linear
      channel_mlp_skip: soft-gating
      implementation: factorized
      positional_embedding: null

search_space:
  data.batch_size:
    name: batch_size
    kind: categorical
    values: [1, 2, 4]
  training.gradient_accumulation_steps:
    name: gradient_accumulation_steps
    kind: categorical
    values: [1, 2, 4]
