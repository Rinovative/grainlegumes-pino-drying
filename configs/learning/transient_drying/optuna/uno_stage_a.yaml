study:
  name: transient_drying_uno_stage_a_search
  role: production
  seed: 9
  n_trials: 30
  sampler:
    kind: tpe
    multivariate: true
  pruner:
    kind: median
    n_startup_trials: 5
    n_warmup_steps: 5
    interval_steps: 1

experiment:
  task: transient_drying
  run:
    seed: 9
    deterministic: true
    device: auto
    suffix: optuna_stage_a
  data:
    train_dataset: transient_drying__material_pilot__id
    ood_datasets:
    - transient_drying__family_generalization__ood
    batch_size: 2
    transient_backend_preference: pt_shards
    transient_backend_required: false
    hdf5_cache_size: 0
    allow_technical_smoke: false
  input_profile: canonical_physics_complete_v1
  temporal:
    sampling:
      mode: one_step_transition
    temporal_conditioning:
      kind: none
  scaling:
    mode: state_std
  loss:
    data:
      kind: huber
      space: scaled_increment
      weight: 1.0
      beta: 1.0
      channel_weights:
      - 1.0
      - 1.0
      - 1.0
      - 1.0
      state_aux_weight: 0.0
    physics:
      enabled: false
      continuity: none
  evaluation:
    objective:
      id: normalized_drying_group_macro_rmse
  optimizer:
    kind: adamw
    lr: 0.0005319714363424885
    weight_decay: 0.0001
  scheduler:
    kind: reduce_on_plateau
    factor: 0.5
    patience: 10
    min_lr: 1.0e-06
  training:
    epochs: 100
    evaluation_interval: 1
    ood_evaluation_interval: 1
    mixed_precision: false
    stage: a
    comparison_arm: a0
    gradient_accumulation_steps: 1
    fixed_evaluation_horizon: 1
    curriculum:
      lengths:
      - 1
      milestone_fractions:
      - 0.0
      seed: 9
    matched_compute:
      planned_seconds: null
      planned_steps: null
      rollout_reference_seconds: null
      rollout_reference_steps: null
    teacher_handoff: null
  tracking:
    wandb:
      mode: offline
      workflow: optuna_trial
      monitor:
        enabled: false
        interval: 1
        max_cases: 1
  model:
    kind: uno
    params:
      modes_x: 64
      modes_y: 64
      hidden_channels: 32
      n_layers: 7
      mode_ratio: 0.4951318201313778
      uno_scalings:
      - - 1
        - 1
      - - 0.5
        - 0.5
      - - 0.5
        - 0.5
      - - 1
        - 1
      - - 1
        - 1
      - - 2
        - 2
      - - 2
        - 2
      channel_mlp_skip: linear
      positional_embedding: null

search_space:
  model.params.modes_x:
    name: modes_x
    kind: categorical
    values: [32, 48, 64]
  model.params.modes_y:
    name: modes_y
    kind: categorical
    values: [32, 48, 64]
  model.params.hidden_channels:
    name: hidden_channels
    kind: categorical
    values: [16, 32, 64]
  model.params.mode_ratio:
    name: mode_ratio
    kind: float
    low: 0.4
    high: 0.6
  optimizer.lr:
    name: learning_rate
    kind: float
    low: 0.0001
    high: 0.003
    log: true
  data.batch_size:
    name: batch_size
    kind: categorical
    values: [1, 2, 4]
