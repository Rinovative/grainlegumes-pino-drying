task: transient_drying
run:
  seed: 9
  deterministic: true
  device: cpu
  suffix: technical_smoke
data:
  train_dataset: transient_drying__material_pilot__id
  ood_datasets: []
  batch_size: 1
  transient_backend_preference: canonical_hdf5
  transient_backend_required: false
  hdf5_cache_size: 0
  allow_technical_smoke: true
  spatial_stride: 2
input_profile: canonical_physics_complete_v1
temporal:
  sampling:
    mode: one_step_transition
  temporal_conditioning:
    kind: none
scaling:
  mode: state_std
loss:
  data:
    kind: huber
    space: scaled_increment
    weight: 1.0
    beta: 1.0
    channel_weights:
    - 1.0
    - 1.0
    - 1.0
    - 1.0
    state_aux_weight: 0.0
  physics:
    enabled: false
    continuity: none
evaluation:
  objective:
    id: normalized_drying_group_macro_rmse
optimizer:
  kind: adamw
  lr: 0.0003883614530748613
  weight_decay: 0.0001
scheduler:
  kind: reduce_on_plateau
  factor: 0.5
  patience: 10
  min_lr: 1.0e-06
training:
  epochs: 1
  stage_schedule:
    mode: stage_a_only
    budget_unit: epochs
    total_epochs: 1
    stage_a_fraction: null
    stage_b_fraction: null
    stage_a_epochs: 1
    stage_b_epochs: 0
    rounding: not_applicable
  evaluation_interval: 1
  ood_evaluation_interval: 1
  mixed_precision: false
  stage: a
  comparison_arm: a0
  gradient_accumulation_steps: 1
  fixed_evaluation_horizon: 1
  curriculum:
    lengths:
    - 1
    milestone_fractions:
    - 0.0
    seed: 9
  matched_compute:
    planned_seconds: null
    planned_steps: null
    rollout_reference_seconds: null
    rollout_reference_steps: null
  teacher_handoff: null
tracking:
  wandb:
    mode: disabled
    workflow: train
    monitor:
      enabled: false
      interval: 1
      max_cases: 1
model:
  kind: fno
  params:
    n_modes:
    - 8
    - 8
    hidden_channels: 8
    n_layers: 3
    positional_embedding: null
