task: transient_drying
run:
  revision: 0
  seed: 9
  deterministic: true
  device: cuda
  suffix: null
data:
  train_dataset:
    name: lentil+chickpea_id
    revision: 0
  ood_datasets:
  - name: kidney_bean_near_family_ood
    revision: 0
  batch_size: 2
  transient_backend_preference: pt_shards
  transient_backend_required: true
  hdf5_cache_size: 0
  allow_technical_smoke: false
input_profile: canonical_physics_complete_v1
temporal:
  temporal_conditioning:
    kind: none
scaling:
  mode: state_std
loss:
  data:
    kind: huber
    space: scaled_increment
    weight: 1.0
    beta: 1.0
    channel_weights:
    - 1.0
    - 1.0
    - 1.0
    - 1.0
    state_aux_weight: 0.0
  physics:
    enabled: false
    continuity: none
evaluation:
  objective:
    id: normalized_drying_group_macro_rmse
optimizer:
  kind: adamw
  lr: 0.0003883614530748613
  weight_decay: 0.0001
scheduler:
  kind: reduce_on_plateau
  factor: 0.5
  patience: 10
  min_lr: 1.0e-06
training:
  mixed_precision: false
  stage_schedule:
    mode: joint_ab
    budget_unit: epochs
    total_epochs: 200
    stage_a_fraction: 0.5
  stage_a:
    evaluation_interval: 1
    ood_evaluation_interval: 1
    gradient_accumulation_steps: 1
    sampling:
      mode: one_step_transition
    fixed_evaluation_horizon: 1
    curriculum:
      lengths:
      - 1
      milestone_fractions:
      - 0.0
      seed: 9
  stage_b:
    evaluation_interval: 1
    ood_evaluation_interval: 1
    gradient_accumulation_steps: 1
    sampling:
      mode: rollout_window
      rollout_length: 32
      window_stride: 32
      window_offset: 0
    fixed_evaluation_horizon: 32
    curriculum:
      lengths:
      - 2
      - 4
      - 8
      - 16
      - 32
      milestone_fractions:
      - 0.0
      - 0.2
      - 0.4
      - 0.6
      - 0.8
      seed: 9
    matched_compute:
      planned_seconds: null
      planned_steps: null
      rollout_reference_seconds: null
      rollout_reference_steps: null
tracking:
  wandb:
    mode: offline
    workflow: train
    monitor:
      enabled: false
      interval: 1
      max_cases: 1
model:
  kind: fno
  params:
    n_modes:
    - 128
    - 160
    hidden_channels: 64
    n_layers: 3
    lifting_channel_ratio: 2
    projection_channel_ratio: 2
    fno_skip: linear
    channel_mlp_skip: soft-gating
    implementation: factorized
    positional_embedding: null
