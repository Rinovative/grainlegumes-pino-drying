# Role: steady_flow Optuna study; its experiment section overrides base.yaml. Edit: freely.
# Supervised UNO hyperparameter search.
#
# Searches:
#   - Fourier modes
#   - hidden channels
#   - network depth
#   - continuous mode ratio
#   - learning rate
#   - batch size
study:
  seed: 9  # Seed controlling Optuna sampling/pruning randomness.
  n_trials: 30  # Maximum number of trials requested for the study.
  sampler:
    kind: tpe  # Optuna sampler family used to propose trial values.
    multivariate: true  # Allow the TPE sampler to model parameter interactions.
  pruner:
    kind: median  # Optuna pruning rule for stopping unpromising trials.
    n_startup_trials: 5  # Trials completed before pruning decisions begin.
    n_warmup_steps: 100  # Reported objective steps required before pruning can occur.
    interval_steps: 5  # Objective-step interval between pruning checks.

experiment:
  task: steady_flow  # Selects the task contract and its compatible data/model/loss validation.
  base: ../base.yaml  # Shared task settings; every value set below overrides them.
  run:
    deterministic: false  # Request deterministic kernels where supported; may reduce performance or reject unsupported operations.
  model:
    kind: uno  # Select the architecture family; its params below are interpreted by that family.
    params:
      modes_x: 64  # Fourier modes retained along the x axis.
      modes_y: 64  # Fourier modes retained along the y axis.
      hidden_channels: 32  # Width of the model’s hidden feature representation.
      n_layers: 5  # Number of architecture layers/blocks; affects capacity and compute.
      mode_ratio: 0.5  # UNO fraction controlling intermediate Fourier-mode allocation.
  loss:
    physics:
      enabled: false  # Enable the physics residual and boundary loss terms.
  optimizer:
    lr: 0.0003883614530748613  # Initial learning rate; controls the optimizer update scale.
  tracking:
    wandb:
      workflow: optuna_trial  # Workflow label attached to tracking metadata.

search_space:
  # UNO architecture.
  model.params.modes_x:
    name: modes_x  # Readable Optuna parameter name for this configuration path.
    kind: categorical  # Distribution type used to sample this parameter.
    values: [32, 48, 64]  # Allowed categorical choices for this parameter.
  model.params.modes_y:
    name: modes_y  # Readable Optuna parameter name for this configuration path.
    kind: categorical  # Distribution type used to sample this parameter.
    values: [32, 48, 64]  # Allowed categorical choices for this parameter.
  model.params.hidden_channels:
    name: hidden_channels  # Readable Optuna parameter name for this configuration path.
    kind: categorical  # Distribution type used to sample this parameter.
    values: [16, 32, 64]  # Allowed categorical choices for this parameter.
  model.params.n_layers:
    name: n_layers  # Readable Optuna parameter name for this configuration path.
    kind: categorical  # Distribution type used to sample this parameter.
    values: [5, 7]  # Allowed categorical choices for this parameter.
  model.params.mode_ratio:
    name: mode_ratio  # Readable Optuna parameter name for this configuration path.
    kind: float  # Distribution type used to sample this parameter.
    low: 0.4  # Inclusive lower search bound.
    high: 0.6  # Inclusive upper search bound.
    log: false  # Sample this range logarithmically when true.
  # Optimisation.
  optimizer.lr:
    name: lr  # Readable Optuna parameter name for this configuration path.
    kind: float  # Distribution type used to sample this parameter.
    low: 0.0001  # Inclusive lower search bound.
    high: 0.003  # Inclusive upper search bound.
    log: true  # Sample this range logarithmically when true.
  data.batch_size:
    name: batch  # Readable Optuna parameter name for this configuration path.
    kind: categorical  # Distribution type used to sample this parameter.
    values: [16, 32]  # Allowed categorical choices for this parameter.
