# Role: steady_flow Optuna study; its experiment section states only what differs from base.yaml and the U-NO defaults. Edit: freely.
# Physics-informed U-NO weight search: 20 trials of half the 600-epoch budget on validation; model and learning rate are the supervised U-NO twin's (uno_search); copy the selected weights into the pi-uno experiment under experiments/architecture_comparison/ and rename it: its name lists the weights (`w`) and warm-up (`wu`) the file sets (configs/README.md), and every other value comes from base.yaml.

study:
  n_trials: 20  # Total trial allocation of the study, its configured base first; a rerun runs only the trials left.
  seed: 9  # Seed controlling Optuna sampling/pruning randomness.
  twin_of: ../experiments/architecture_comparison/uno_m64x64_h32_l7_p0p1_s1-05-05-1-1-2-2_r0p495__lr-0p000532.yaml  # Supervised twin: every value outside loss.physics, k (training.units_per_update, base.yaml's 16 there) included, must equal it.
  budget_fraction: 0.5  # Trial budget as a fraction of the budget K (training.budget_epochs): 300 of 600 passes, each trial with its own cosine.
  sampler:
    kind: tpe  # Optuna sampler family used to propose trial values.
    multivariate: true  # Allow the TPE sampler to model parameter interactions.
  pruner:
    kind: median  # Optuna pruning rule for stopping unpromising trials.
    n_startup_trials: 5  # Completed trials before pruning decisions begin.
    n_min_trials: 5  # Trials that must have reported at the same validation point before a trial can be pruned there.
    n_warmup_steps: 7  # Start point: point 7 is 105 of 300 epochs, the first validation point after the 100-epoch physics warm-up.
    interval_steps: 1  # Validation-point interval between pruning checks.

# One entry per searched config path: name (Optuna parameter name), kind (categorical or float) and its values or low, high and log (default false).
search_space:
  loss.physics.momentum_weight.target: {name: mom_weight, kind: float, low: 1.0e-3, high: 1.0e+1, log: true}  # Two decades around the starting weight.
  loss.physics.continuity_weight.target: {name: cont_weight, kind: float, low: 1.0e-1, high: 1.0e+3, log: true}  # Two decades around the starting weight.
  loss.physics.boundary_weight.target: {name: bc_weight, kind: float, low: 1.0e-1, high: 1.0e+3, log: true}  # Two decades around the starting weight.

experiment:
  model:
    kind: uno  # Architecture family; its params below are interpreted by that family.
    params:
      modes_x: 64  # Fourier modes along the x axis; the supervised twin's.
      modes_y: 64  # Fourier modes along the y axis; the supervised twin's.
      hidden_channels: 32  # Width of the hidden feature representation; the supervised twin's.
      n_layers: 7  # Number of U-NO layers; the supervised twin's.
      mode_ratio: 0.4951318201313778  # Fraction controlling the intermediate Fourier-mode allocation; the supervised twin's.
      uno_scalings: [[1.0, 1.0], [0.5, 0.5], [0.5, 0.5], [1.0, 1.0], [1.0, 1.0], [2.0, 2.0], [2.0, 2.0]]  # Per-layer [y, x] spatial scaling schedule; its length must match n_layers.
  optimizer:
    lr: 5.319714363424885e-4  # Initial learning rate; placeholder until the uno_search study selects it.
  loss:
    physics:
      enabled: true  # Enable the physics residual and boundary loss terms.
      derivatives:
        kind: physical  # Derivative backend: physical is central finite differences on the grid, spectral adds Fourier continuation.
      momentum_weight:
        target: 1.0e-1  # Search base value: target multiplier for the dimensionless Brinkman momentum residual.
        warmup:
          epochs: 100  # Epochs over which the momentum weight ramps linearly to its target; fixed for all three weights.
      continuity_weight:
        target: 1.0e+1  # Search base value: target multiplier for the dimensionless cross-section flux balance.
        warmup:
          epochs: 100  # Epochs over which the continuity weight ramps linearly to its target.
      boundary_weight:
        target: 1.0e+1  # Search base value: target multiplier for the dimensionless pressure-boundary residual.
        warmup:
          epochs: 100  # Epochs over which the boundary weight ramps linearly to its target.
  tracking:
    wandb:
      workflow: optuna_trial  # Workflow label attached to tracking metadata.
  task: steady_flow  # Selects the task contract and its compatible data, model and loss validation.
  base: ../base.yaml  # Shared task settings; every value set in this section overrides them.
