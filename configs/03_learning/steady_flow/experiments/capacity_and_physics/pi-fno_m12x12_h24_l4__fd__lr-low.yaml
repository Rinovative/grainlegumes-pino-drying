# Role: one steady_flow experiment; values set here override base.yaml. Edit: freely.
task: steady_flow  # Selects the task contract and its compatible data/model/loss validation.
base: ../../base.yaml  # Shared task settings; every value set below overrides them.

run:
  deterministic: true  # Request deterministic kernels where supported; may reduce performance or reject unsupported operations.

model:
  kind: fno  # Select the architecture family; its params below are interpreted by that family.
  params:
    n_modes: [12, 12]  # Fourier modes retained along each spatial axis; higher values increase spectral capacity and cost.
    hidden_channels: 24  # Width of the model’s hidden feature representation.
    n_layers: 4  # Number of architecture layers/blocks; affects capacity and compute.
    lifting_channel_ratio: 2  # FNO lifting width relative to hidden_channels.
    projection_channel_ratio: 2  # FNO projection width relative to hidden_channels.
    fno_skip: linear  # FNO spectral-block skip connection type.
    channel_mlp_skip: soft-gating  # Channel-MLP skip connection type.
    implementation: factorized  # FNO spectral implementation choice; factorized uses factorized spectral weights.

loss:
  physics:
    enabled: true  # Enable the physics residual and boundary loss terms.
    derivatives:
      kind: physical  # Choose physical-grid or spectral derivatives for physics residuals.
      extension: none  # Boundary extension used by spectral derivatives.
    interior_crop: 2  # Number of boundary cells excluded from interior residual evaluation.
    momentum_weight:
      target: 1.0  # Target multiplier for the dimensionless Brinkman momentum residual.
      warmup:
        kind: linear  # Ramp rule used to reach the momentum target weight.
        epochs: 1  # Epochs over which the momentum weight ramps to its target.
    continuity_weight:
      target: 1.0e+3  # Target multiplier for the dimensionless cross-section flux balance.
      warmup:
        kind: linear  # Ramp rule used to reach the continuity target weight.
        epochs: 1  # Epochs over which the continuity weight ramps to its target.
    boundary_weight:
      target: 1.0e+2  # Target multiplier for the dimensionless pressure-boundary residual.
      warmup:
        kind: linear  # Ramp rule used to reach the boundary target weight.
        epochs: 1  # Epochs over which the boundary weight ramps to its target.

optimizer:
  lr: 6.25e-4  # Initial learning rate; controls the optimizer update scale.
