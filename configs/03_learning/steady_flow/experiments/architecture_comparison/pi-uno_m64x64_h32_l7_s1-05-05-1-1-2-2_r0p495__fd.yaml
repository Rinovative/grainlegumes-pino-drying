# Role: one steady_flow experiment; values set here override base.yaml. Edit: freely.
task: steady_flow  # Selects the task contract and its compatible data/model/loss validation.
base: ../../base.yaml  # Shared task settings; every value set below overrides them.

run:
  deterministic: false  # Request deterministic kernels where supported; may reduce performance or reject unsupported operations.

model:
  kind: uno  # Select the architecture family; its params below are interpreted by that family.
  params:
    modes_x: 64  # Fourier modes retained along the x axis.
    modes_y: 64  # Fourier modes retained along the y axis.
    hidden_channels: 32  # Width of the model’s hidden feature representation.
    n_layers: 7  # Number of architecture layers/blocks; affects capacity and compute.
    mode_ratio: 0.4951318201313778  # UNO fraction controlling intermediate Fourier-mode allocation.
    uno_scalings: [[1.0, 1.0], [0.5, 0.5], [0.5, 0.5], [1.0, 1.0], [1.0, 1.0], [2.0, 2.0], [2.0, 2.0]]  # Per-layer [y, x] spatial scaling schedule; its length must match n_layers.
    channel_mlp_skip: linear  # Channel-MLP skip connection type.

loss:
  physics:
    enabled: true  # Enable the physics residual and boundary loss terms.
    derivatives:
      kind: physical  # Choose physical-grid or spectral derivatives for physics residuals.
      extension: none  # Boundary extension used by spectral derivatives.
    interior_crop: 2  # Number of boundary cells excluded from interior residual evaluation.
    momentum_weight:
      target: 1.0  # Target multiplier for the dimensionless Brinkman momentum residual.
      warmup:
        kind: linear  # Ramp rule used to reach the momentum target weight.
        epochs: 300  # Epochs over which the momentum weight ramps to its target.
    continuity_weight:
      target: 1.0e+3  # Target multiplier for the dimensionless cross-section flux balance.
      warmup:
        kind: linear  # Ramp rule used to reach the continuity target weight.
        epochs: 300  # Epochs over which the continuity weight ramps to its target.
    boundary_weight:
      target: 1.0e+2  # Target multiplier for the dimensionless pressure-boundary residual.
      warmup:
        kind: linear  # Ramp rule used to reach the boundary target weight.
        epochs: 300  # Epochs over which the boundary weight ramps to its target.

optimizer:
  lr: 5.319714363424885e-04  # Initial learning rate; controls the optimizer update scale.

tracking:
  wandb:
    monitor:
      enabled: true  # Enable periodic qualitative/diagnostic monitoring.
      max_cases: 4  # Maximum cases sampled for each monitoring pass.
    upload:
      evaluation_artifacts: false  # Upload evaluation artifacts to the tracking service.
