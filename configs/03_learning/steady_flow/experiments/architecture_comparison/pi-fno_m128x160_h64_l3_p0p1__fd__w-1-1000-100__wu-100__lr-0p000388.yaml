# Role: one physics-informed steady_flow experiment; states only what differs from base.yaml and the FNO defaults. Edit: freely.

model:
  kind: fno  # Architecture family; its params below are interpreted by that family.
  params:
    n_modes: [128, 160]  # Fourier modes retained along each spatial axis, ordered [Y, X]; higher values increase spectral capacity and cost.
    hidden_channels: 64  # Width of the hidden feature representation.
    n_layers: 3  # Number of Fourier layers; affects capacity and compute.

optimizer:
  lr: 3.883614530748613e-4  # Initial learning rate; placeholder until the fno_search study selects it.

loss:
  physics:
    enabled: true  # Enable the physics residual and boundary loss terms.
    derivatives:
      kind: physical  # Derivative backend: physical is central finite differences on the grid (suffix __fd), spectral adds Fourier continuation (suffix __spec).
    momentum_weight:
      target: 1.0  # Target multiplier for the dimensionless Brinkman momentum residual; placeholder until the pi-fno_search study selects it.
      warmup:
        epochs: 100  # Epochs over which the momentum weight ramps linearly to its target.
    continuity_weight:
      target: 1.0e+3  # Target multiplier for the dimensionless cross-section flux balance; placeholder until the pi-fno_search study selects it.
      warmup:
        epochs: 100  # Epochs over which the continuity weight ramps linearly to its target.
    boundary_weight:
      target: 1.0e+2  # Target multiplier for the dimensionless pressure-boundary residual; placeholder until the pi-fno_search study selects it.
      warmup:
        epochs: 100  # Epochs over which the boundary weight ramps linearly to its target.

task: steady_flow  # Selects the task contract and its compatible data, model and loss validation.
base: ../../base.yaml  # Shared task settings; every value set in this file overrides them.
