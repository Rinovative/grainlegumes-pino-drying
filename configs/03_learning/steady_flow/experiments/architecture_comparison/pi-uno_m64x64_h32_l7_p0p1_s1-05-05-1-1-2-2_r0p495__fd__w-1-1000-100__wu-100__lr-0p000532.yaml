# Role: one physics-informed steady_flow experiment; states only what differs from base.yaml and the U-NO defaults. Edit: freely.

model:
  kind: uno  # Architecture family; its params below are interpreted by that family.
  params:
    modes_x: 64  # Fourier modes retained along the x axis.
    modes_y: 64  # Fourier modes retained along the y axis.
    hidden_channels: 32  # Width of the hidden feature representation.
    n_layers: 7  # Number of U-NO layers; affects capacity and compute.
    mode_ratio: 0.4951318201313778  # Fraction controlling the intermediate Fourier-mode allocation.
    uno_scalings: [[1.0, 1.0], [0.5, 0.5], [0.5, 0.5], [1.0, 1.0], [1.0, 1.0], [2.0, 2.0], [2.0, 2.0]]  # Per-layer [y, x] spatial scaling schedule; its length must match n_layers.

optimizer:
  lr: 5.319714363424885e-4  # Initial learning rate; placeholder until the uno_search study selects it.

loss:
  physics:
    enabled: true  # Enable the physics residual and boundary loss terms.
    derivatives:
      kind: physical  # Derivative backend: physical is central finite differences on the grid (suffix __fd), spectral adds Fourier continuation (suffix __spec).
    momentum_weight:
      target: 1.0  # Target multiplier for the dimensionless Brinkman momentum residual; placeholder until the pi-uno_search study selects it.
      warmup:
        epochs: 100  # Epochs over which the momentum weight ramps linearly to its target.
    continuity_weight:
      target: 1.0e+3  # Target multiplier for the dimensionless cross-section flux balance; placeholder until the pi-uno_search study selects it.
      warmup:
        epochs: 100  # Epochs over which the continuity weight ramps linearly to its target.
    boundary_weight:
      target: 1.0e+2  # Target multiplier for the dimensionless pressure-boundary residual; placeholder until the pi-uno_search study selects it.
      warmup:
        epochs: 100  # Epochs over which the boundary weight ramps linearly to its target.

task: steady_flow  # Selects the task contract and its compatible data, model and loss validation.
base: ../../base.yaml  # Shared task settings; every value set in this file overrides them.
