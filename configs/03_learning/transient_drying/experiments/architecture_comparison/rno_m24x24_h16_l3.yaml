# Role: one transient_drying experiment; values set here override base.yaml. Edit: freely.
task: transient_drying  # Selects the task contract and its compatible data/model/loss validation.
base: ../../base.yaml  # Shared task settings; every value set below overrides them.

model:
  kind: rno  # Select the architecture family; its params below are interpreted by that family.
  params:
    n_modes: [24, 24]  # Fourier modes retained along each spatial axis; higher values increase spectral capacity and cost.
    hidden_channels: 16  # Width of the model’s hidden feature representation.
    n_layers: 3  # Number of architecture layers/blocks; affects capacity and compute.
    rno_skip: false  # Recurrent residual skip path; must be false because skip-added hidden states break step-wise carry.
    lifting_channel_ratio: 2  # FNO lifting width relative to hidden_channels.
    projection_channel_ratio: 2  # FNO projection width relative to hidden_channels.
    channel_mlp_skip: soft-gating  # Channel-MLP skip connection type.
    fno_skip: linear  # FNO spectral-block skip connection type.
    return_sequences: false  # Whether the recurrent model returns every time step; this task contract requires false.

optimizer:
  lr: 0.0003883614530748613  # Initial learning rate; controls the optimizer update scale.

training:
  a0:
    sampling:
      mode: trajectory  # RNO trains on whole trajectories cut into consecutive windows in temporal order.
      rollout_length: 32  # Window length; the hidden state carries across windows while gradients stop at each boundary.
    curriculum:
      lengths: [2, 4, 8, 16, 32]  # Self-fed rollout lengths of this stage's curriculum; they must fit the sampling rollout length.
      milestone_fractions: [0.0, 0.2, 0.4, 0.6, 0.8]  # Fractions of the stage budget at which curriculum lengths advance.
  b:
    sampling:
      mode: trajectory  # RNO trains on whole trajectories cut into consecutive windows in temporal order.
