# Role: one transient_drying experiment; values set here override base.yaml. Edit: freely.
task: transient_drying  # Selects the task contract and its compatible data/model/loss validation.
base: ../../base.yaml  # Shared task settings; every value set below overrides them.

model:
  kind: uno  # Select the architecture family; its params below are interpreted by that family.
  params:
    modes_x: 64  # Fourier modes retained along the x axis.
    modes_y: 64  # Fourier modes retained along the y axis.
    hidden_channels: 32  # Width of the model’s hidden feature representation.
    n_layers: 7  # Number of architecture layers/blocks; affects capacity and compute.
    mode_ratio: 0.4951318201313778  # UNO fraction controlling intermediate Fourier-mode allocation.
    uno_scalings:  # Per-layer [y, x] spatial scaling schedule; its length must match n_layers.
    - - 1
      - 1
    - - 0.5
      - 0.5
    - - 0.5
      - 0.5
    - - 1
      - 1
    - - 1
      - 1
    - - 2
      - 2
    - - 2
      - 2
    lifting_channel_ratio: 2  # U-NO lifting width relative to hidden_channels.
    projection_channel_ratio: 2  # U-NO projection width relative to hidden_channels.
    channel_mlp_skip: linear  # Channel-MLP skip connection type.

optimizer:
  # Placeholder until the uno_a0_search study selects it.
  lr: 0.0005319714363424885 # Initial learning rate; controls the optimizer update scale.

training:
  a0:
    sampling:
      mode: one_step_transition  # Choose single-transition or rollout-window training examples.
    curriculum:
      lengths: [1]  # Self-fed rollout lengths of this stage's curriculum; they must fit the sampling rollout length.
      milestone_fractions: [0.0]  # Fractions of the stage budget at which curriculum lengths advance.
  b:
    sampling:
      mode: rollout_window  # Choose single-transition or rollout-window training examples.
      window_stride: 32  # Step between rollout-window starts in the sampled trajectory.
      window_offset: 0  # Starting offset applied when selecting rollout windows.
