# Role: one transient_drying experiment; values set here override base.yaml. Edit: freely.
task: transient_drying  # Selects the task contract and its compatible data/model/loss validation.
base: ../../base.yaml  # Shared task settings; every value set below overrides them.

model:
  kind: fno  # Select the architecture family; its params below are interpreted by that family.
  params:
    n_modes: [64, 80]  # Fourier modes retained along each spatial axis; higher values increase spectral capacity and cost.
    hidden_channels: 64  # Width of the model’s hidden feature representation.
    n_layers: 3  # Number of architecture layers/blocks; affects capacity and compute.
    lifting_channel_ratio: 2  # FNO lifting width relative to hidden_channels.
    projection_channel_ratio: 2  # FNO projection width relative to hidden_channels.
    fno_skip: linear  # FNO spectral-block skip connection type.
    channel_mlp_skip: soft-gating  # Channel-MLP skip connection type.
    implementation: factorized  # FNO spectral implementation choice; factorized uses factorized spectral weights.

optimizer:
  # Placeholder until the fno_a0_search study selects it.
  lr: 0.0003883614530748613 # Initial learning rate; controls the optimizer update scale.

training:
  a0:
    sampling:
      mode: one_step_transition  # Choose single-transition or rollout-window training examples.
    curriculum:
      lengths: [1]  # Self-fed rollout lengths of this stage's curriculum; they must fit the sampling rollout length.
      milestone_fractions: [0.0]  # Fractions of the stage budget at which curriculum lengths advance.
  b:
    sampling:
      mode: rollout_window  # Choose single-transition or rollout-window training examples.
      window_stride: 32  # Step between rollout-window starts in the sampled trajectory.
      window_offset: 0  # Starting offset applied when selecting rollout windows.
