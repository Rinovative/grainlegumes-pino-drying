# Role: transient_drying U-NO A0 study (stage_a_only); cannot inherit base.yaml, so its experiment restates the shared values. Edit: freely.
# Tunes the teacher-forced A0 that B and A1 continue from; copy the selected values into the matched experiment config. Only the model, lr, temporal.sampling, training, run.device and tracking workflow may differ from base.yaml; a test keeps the rest equal.

study:
  n_trials: 24  # Maximum number of trials requested for the study.
  mode: stage_a_only  # Transient protocol searched by this study: A0 alone.
  role: production  # Study role used by the experiment workflow.
  seed: 9  # Seed controlling Optuna sampling/pruning randomness.
  sampler:
    kind: tpe  # Optuna sampler family used to propose trial values.
    multivariate: true  # Allow the TPE sampler to model parameter interactions.
  pruner:
    kind: median  # Optuna pruning rule for stopping unpromising trials.
    n_startup_trials: 5  # Trials completed before pruning decisions begin.
    n_warmup_steps: 8  # Reported objective steps (epochs) required before pruning can occur.
    interval_steps: 1  # Objective-step interval between pruning checks; the study contract requires it to equal training.evaluation_interval.

# One entry per searched config path: name (Optuna parameter name), kind (categorical or float) and its values or low, high and log (default false).
search_space:
  model.params.modes_x: {name: modes_x, kind: categorical, values: [32, 48, 64]}
  model.params.modes_y: {name: modes_y, kind: categorical, values: [32, 48]}  # 64 exceeds the 63 Y modes a 5-layer U-NO admits on the 126 x 201 training grid.
  model.params.hidden_channels: {name: hidden_channels, kind: categorical, values: [16, 32, 64]}
  model.params.n_layers: {name: n_layers, kind: categorical, values: [5, 7]}  # U-NO supports exactly 5 or 7 layers.
  model.params.mode_ratio: {name: mode_ratio, kind: float, low: 0.4, high: 0.6}
  optimizer.lr: {name: lr, kind: float, low: 1.0e-4, high: 3.0e-3, log: true}
  data.batch_size: {name: batch, kind: categorical, values: [2, 4]}

experiment:
  model:
    kind: uno  # Architecture family; its params below are interpreted by that family.
    params:
      modes_x: 64  # Search base value: Fourier modes along the x axis.
      modes_y: 48  # Search base value: Fourier modes along the y axis; a 5-layer U-NO admits at most 63 on the training grid.
      hidden_channels: 32  # Search base value: width of the hidden feature representation.
      n_layers: 7  # Search base value: number of U-NO layers; uno_scalings stays unset so each depth uses its default [y, x] scaling schedule.
      mode_ratio: 0.4951318201313778  # Search base value: fraction controlling the intermediate Fourier-mode allocation.
      positional_embedding: null  # No positional embedding: x and y are explicit input channels.
      domain_padding: 0.1  # Symmetric zero padding of 10 % per side of the lifted field.
  optimizer:
    lr: 5.319714363424885e-4  # Search base value: initial learning rate.
    kind: adamw  # Optimizer implementation; the training contract supports AdamW.
    weight_decay: 1.0e-4  # AdamW decoupled weight-decay coefficient.
  temporal:
    sampling:
      mode: one_step_transition  # Teacher-forced single-transition training examples; A0's curriculum stays the one-step default.
    temporal_conditioning:
      kind: none  # Whether normalized current time is appended as an input channel; none adds no time channel.
  training:
    epochs: 40  # Trial epoch budget of this single-stage run, shorter than the matched a0.max_epochs to rank configurations cheaply; equals stage_schedule.total_epochs.
    stage_schedule:
      mode: stage_a_only  # A0 alone; the only transient protocol Optuna searches.
      budget_unit: epochs  # Unit used to express the training budget.
      total_epochs: 40  # Trial epoch budget; must equal training.epochs.
    evaluation_interval: 1  # Roll out the whole validation trajectories every this many stage epochs; this selects the stage checkpoint.
    ood_evaluation_interval: 1  # Evaluate the material-OOD and parameter-OOD roles at this stage interval.
  run:
    seed: 9  # Base seed for derived data-loader, initialization, and training randomness.
    deterministic: false  # Strict deterministic CUDA rejects kernels these transient models use (cumsum and others).
    device: auto  # Differs from base.yaml (cuda): requested compute device; auto selects an available supported device.
  data:
    train_dataset: null  # Exact built Dataset ID; null needs --train-dataset.
    train_subset: null  # null trains on every Train case; a power of two N trains on the first N Train cases per ID material (learning curve).
    batch_size: 2  # Search base value: cases per optimizer batch.
    spatial_stride: 2  # Spatial subsampling step; larger strides reduce the effective grid resolution.
    material_ood_datasets: []  # Optional built datasets whose declared OOD cases join the training Dataset's in the material-OOD role.
    num_workers: 0  # The matched B/A1 stages require main-process loading, and the benchmark measured 905 items/s with 0 workers against 33-37 with 2-4.
    persistent_workers: false  # No worker processes exist to keep alive.
  scheduler:
    kind: reduce_on_plateau  # Learning-rate schedule policy.
    factor: 0.5  # Multiplicative learning-rate reduction after a plateau.
    patience: 10  # Validation checks without improvement before reducing the learning rate; one check per epoch at evaluation_interval 1.
    min_lr: 1.0e-6  # Lower bound for the scheduled learning rate.
  loss:
    data:
      kind: huber  # Supervised error formulation; valid choices depend on the task contract.
      space: scaled_increment  # Space in which the supervised error is measured, such as normalized state or scaled increment.
      weight: 1.0  # Multiplier on the supervised data-loss term.
      beta: 1.0  # Huber transition scale between quadratic and linear error behavior.
      channel_weights: [1.0, 1.0, 1.0, 1.0]  # Per-channel multipliers for the supervised loss; order follows the task state channels.
      state_aux_weight: 0.0  # Weight of the optional auxiliary state-prediction term; zero disables it.
    physics:
      enabled: false  # Enable the physics residual and boundary loss terms.
  evaluation:
    objective:
      id: normalized_drying_group_macro_rmse  # Metric that compares trials and checkpoints and drives the scheduler and the study objective.
  input_profile: canonical_physics_complete  # Transient input/state profile expected by the dataset and model.
  scaling:
    mode: state_std  # State/increment scaling rule used by transient training and evaluation.
  tracking:
    wandb:
      workflow: optuna_trial  # Differs from base.yaml (train): workflow label attached to tracking metadata.
      mode: online  # W&B logging mode, such as online or offline.
      monitor:
        enabled: false  # Enable periodic qualitative/diagnostic monitoring.
        interval: 1  # Monitoring interval in epochs.
        max_cases: 1  # Maximum cases sampled for each monitoring pass.
  task: transient_drying  # Selects the task contract and its compatible data, model and loss validation.
