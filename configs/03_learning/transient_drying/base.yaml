# Role: shared defaults of every transient_drying matched A0 -> {B, A1} experiment. Edit: rarely; a config that sets a value overrides it.
# The code holds no default for what this file states; configs/README.md lists every key a config chain must state. The Optuna A0 studies under optuna/ inherit it too and tune its A0 alone.

training:
  mode: matched_a1_b  # A0 -> {B, A1}: B self-feeds rollouts, A1 stays teacher-forced; both start from A0's selected checkpoint. Every stage validates at each 1/20 of its budget.
  units_per_update: 16  # k, units per optimizer update in every stage: FNO and UNO one transition in A0 and A1 and one rollout window in B; the RNO one whole trajectory (its configs set 4). Every Train case counts equally per epoch.
  memory_batch: 2  # Units computed at once; gradients accumulate up to k, so it changes only floating-point rounding, never the science.
  a0:
    budget_epochs: 100  # A0 budget K in passes over the full Train set, counted in seen units; the best validation checkpoint is handed to B and A1, and an A0 study trains a fraction of it. --epochs overrides it and names another run (seed-N__ep-E__k-K__sch-S).
  b:
    train_seconds: null  # B budget in optimisation-clock seconds, set per experiment or via --train-seconds: A0's measured optimisation clock (terminal_budget.train_seconds) on the same GPU type. B stops after the group that crosses it; there is no epoch cap.
    lr_scale: 1.0  # B restarts its own schedule at lr_scale times A0's start rate and keeps only A0's Adam moments and step counters.
    sampling:
      rollout_length: 32  # Number of consecutive transitions in each sampled rollout window; a shorter case forms one window over its whole trajectory.
    curriculum:
      lengths: [2, 4, 8, 16, 32]  # Self-fed rollout lengths of this stage's curriculum, drawn per window and capped at a shorter window; they must fit the sampling rollout length.
      milestone_fractions: [0.0, 0.2, 0.4, 0.6, 0.8]  # Fractions of the stage budget at which curriculum lengths advance.
  a1:  # Teacher-forced continuation with A0's sampling.
    lr_scale: 1.0  # A1 restarts its own schedule at lr_scale times A0's start rate; keep equal to B's unless a sweep selected otherwise.
    match_to: b.train_seconds  # A1 trains for B's measured seconds from the same A0 checkpoint.

data:
  train_dataset: null  # Exact built Dataset ID; null needs --train-dataset.
  train_subset: null  # null trains on every Train case; a power of two N trains on the first N Train cases per ID material (learning curve).
  evaluation_batch_size: 2  # Whole trajectories per evaluation batch; memory only, metrics accumulate over the whole role.
  spatial_stride: 1  # Endpoint-preserving grid stride of training, scaling fit and checkpoint selection; 1 is the full 251 x 401 grid, 2 only for the stride comparison, and a stride that does not tile the grid is refused.
  material_ood_datasets: []  # Optional built datasets whose declared OOD cases join the training Dataset's in the material-OOD role.
  num_workers: 0  # Main-process loading; the loader benchmark measured 905 items/s with 0 workers against 33-37 with 2-4.
  persistent_workers: false  # No worker processes exist to keep alive.

optimizer:
  kind: adamw  # Optimizer implementation; the training contract supports AdamW.
  weight_decay: 1.0e-4  # AdamW decoupled weight-decay coefficient.

scheduler:
  kind: cosine  # Half cosine from the stage's start rate to 0 over each stage's budget fraction, without warm-up, restart or floor.

loss:
  data:
    kind: mse  # Group-weighted error of the reconstructed Train-scaled states (T 1/3, phi 1/3, w_surf 1/6, w_int 1/6); h1 adds squared spatial-gradient errors with length scale 1 m.
    weight: 1.0  # Multiplier on the supervised data-loss term.
  physics:
    enabled: false  # Enable the physics residual and boundary loss terms.

evaluation:
  objective:
    id: normalized_drying_group_macro_rmse  # Metric that compares trials and checkpoints and is the study objective.

model:
  params:
    positional_embedding: null  # No positional embedding: x and y are explicit input channels, and an embedding grid would give one physical point different coordinates at different strides.
    domain_padding: 0.1  # Symmetric zero padding of 10 % per side of the lifted field; the fields are not periodic, and padding keeps the FFT wrap-around away from the boundaries.

input_profile: canonical_physics_complete  # Transient input/state profile expected by the dataset and model.

temporal:
  temporal_conditioning:
    kind: none  # Whether normalized current time is appended as an input channel; none adds no time channel.

run:
  seed: 9  # Base seed for derived data-loader, initialization, and training randomness.
  deterministic: false  # Request deterministic kernels where supported; may reduce performance or reject unsupported operations.
  device: cuda  # Requested compute device; auto selects an available supported device.

tracking:
  wandb:
    mode: online  # W&B logging mode, such as online or offline.
    workflow: train  # Workflow label attached to tracking metadata.
    monitor:
      enabled: false  # Enable the physics monitor at the validation points.
      max_cases: 1  # Maximum cases sampled for each monitoring pass.
