# Role: shared defaults of every transient_drying matched A0 -> {B, A1} experiment. Edit: rarely; a config that sets a value overrides it.
# The code holds no default for what this file states; configs/README.md lists every key a config chain must state. The Optuna A0 studies under optuna/ cannot inherit it and restate its shared values (a test keeps them equal).

training:
  mode: matched_a1_b  # A0 -> {B, A1}: B self-feeds rollouts, A1 stays teacher-forced; both start from A0's selected checkpoint.
  continuation_evaluations: 20  # B and A1 select checkpoints at epoch ends crossing each 1/20 of their measured budget, so both get equal chances.
  a0:
    max_epochs: 100  # A0 epoch budget; the best validation checkpoint is handed to B and A1. --epochs overrides it.
    evaluation_interval: 1  # Roll out the whole validation trajectories every this many epochs; this selects the stage checkpoint.
    ood_evaluation_interval: 1  # Evaluate the material-OOD and parameter-OOD roles at this stage interval.
    gradient_accumulation_steps: 1  # Number of batches accumulated before each optimizer update; increases effective batch size.
    curriculum: {}  # Keeps the one-step teacher-forced default curriculum; its draws derive from run.seed.
  b:
    train_seconds: null  # Measured B optimisation budget in seconds, set per experiment or via --train-seconds: A0's measured optimisation time on the same GPU type.
    max_epochs: 200  # Operational epoch cap; B stops at train_seconds and ends as budget_unmet if this cap comes first.
    lr_scale: 1.0  # Factor on the learning rate and plateau floor restored from A0; 1 continues with A0's state unchanged.
    evaluation_interval: 1  # Epoch-end gate for B's selection checks; B validates only where it crossed a new budget point (continuation_evaluations).
    ood_evaluation_interval: 1  # Evaluate the material-OOD and parameter-OOD roles at this stage interval.
    gradient_accumulation_steps: 1  # Number of batches accumulated before each optimizer update; increases effective batch size.
    sampling:
      rollout_length: 32  # Number of consecutive transitions in each sampled rollout window.
    curriculum:
      lengths: [2, 4, 8, 16, 32]  # Self-fed rollout lengths of this stage's curriculum; they must fit the sampling rollout length.
      milestone_fractions: [0.0, 0.2, 0.4, 0.6, 0.8]  # Fractions of the stage budget at which curriculum lengths advance.
  a1:
    max_epochs: 200  # Operational epoch cap of the teacher-forced continuation, which needs about A0's epoch count to match B's seconds; it takes A0's sampling, curriculum and cadence.
    lr_scale: 1.0  # Factor on the learning rate restored from A0; keep equal to B's unless a sweep selected otherwise.
    match_to: b.train_seconds  # A1 trains for B's measured seconds from the same A0 checkpoint.

data:
  train_dataset: null  # Exact built Dataset ID; null needs --train-dataset.
  train_subset: null  # null trains on every Train case; a power of two N trains on the first N Train cases per ID material (learning curve).
  batch_size: 2  # Cases per optimizer batch; larger values use more memory and change gradient averaging.
  spatial_stride: 2  # Spatial subsampling step; larger strides reduce the effective grid resolution.
  material_ood_datasets: []  # Optional built datasets whose declared OOD cases join the training Dataset's in the material-OOD role.
  num_workers: 0  # Matched B/A1 resume restores the exact partial-epoch sample cursor, which requires main-process loading.
  persistent_workers: false  # No worker processes exist to keep alive.

optimizer:
  kind: adamw  # Optimizer implementation; the training contract supports AdamW.
  weight_decay: 1.0e-4  # AdamW decoupled weight-decay coefficient.

scheduler:
  kind: reduce_on_plateau  # Learning-rate schedule policy.
  factor: 0.5  # Multiplicative learning-rate reduction after a plateau.
  patience: 10  # Validation checks without improvement before reducing the learning rate; A0 checks every epoch, B and A1 at their budget points.
  min_lr: 1.0e-6  # Lower bound for the scheduled learning rate.

loss:
  data:
    kind: huber  # Supervised error formulation; valid choices depend on the task contract.
    space: scaled_increment  # Space in which the supervised error is measured, such as normalized state or scaled increment.
    weight: 1.0  # Multiplier on the supervised data-loss term.
    beta: 1.0  # Huber transition scale between quadratic and linear error behavior.
    channel_weights: [1.0, 1.0, 1.0, 1.0]  # Per-channel multipliers for the supervised loss; order follows the task state channels.
    state_aux_weight: 0.0  # Weight of the optional auxiliary state-prediction term; zero disables it.
  physics:
    enabled: false  # Enable the physics residual and boundary loss terms.

evaluation:
  objective:
    id: normalized_drying_group_macro_rmse  # Metric that compares trials and checkpoints and drives the scheduler and the study objective.

model:
  params:
    positional_embedding: null  # No positional embedding: x and y are explicit input channels, and an embedding grid would give one physical point different coordinates at different strides.
    domain_padding: 0.1  # Symmetric zero padding of 10 % per side of the lifted field; the fields are not periodic, and padding keeps the FFT wrap-around away from the boundaries.

input_profile: canonical_physics_complete  # Transient input/state profile expected by the dataset and model.

temporal:
  temporal_conditioning:
    kind: none  # Whether normalized current time is appended as an input channel; none adds no time channel.

scaling:
  mode: state_std  # State/increment scaling rule used by transient training and evaluation.

run:
  seed: 9  # Base seed for derived data-loader, initialization, and training randomness.
  deterministic: false  # Request deterministic kernels where supported; may reduce performance or reject unsupported operations.
  device: cuda  # Requested compute device; auto selects an available supported device.

tracking:
  wandb:
    mode: online  # W&B logging mode, such as online or offline.
    workflow: train  # Workflow label attached to tracking metadata.
    monitor:
      enabled: false  # Enable periodic qualitative/diagnostic monitoring.
      interval: 1  # Monitoring interval in epochs.
      max_cases: 1  # Maximum cases sampled for each monitoring pass.
